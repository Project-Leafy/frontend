<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>성장 기록 추가</title>

  <!-- Global -->
  <link rel="stylesheet" href="../css/global.css" />

  <!-- Page CSS -->
  <link rel="stylesheet" href="../css/AddJournalScreen.css" />

  <!-- Components CSS -->
  <link rel="stylesheet" href="../css/ui/textarea.css" />
  <link rel="stylesheet" href="../css/ui/badge.css" />
  <link rel="stylesheet" href="../css/ui/alert-dialog.css" />
</head>

<body>

<div class="ajs-wrapper">

  <!-- HEADER -->
  <div class="ajs-header">
    <button id="backButton" class="ajs-back-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" stroke="#6B7280" fill="none" stroke-width="2">
        <path d="M15 18l-6-6 6-6"></path>
      </svg>
    </button>
    <h1 class="ajs-title">성장 기록 추가</h1>
    <div class="ajs-placeholder"></div>
  </div>

  <p class="ajs-nickname" id="plantNickname">식물</p>

  <!-- CONTENT -->
  <div class="ajs-content">

    <!-- 사진 -->
    <div class="ajs-section">
      <label class="ajs-label">사진</label>
      <div id="imageGrid" class="ajs-image-grid"></div>
    </div>

    <!-- 메모 -->
    <div class="ajs-section">
      <label class="ajs-label">메모 <span class="required">*</span></label>
      <textarea id="memoInput" class="textarea" placeholder="오늘의 식물 상태나 특이사항을 기록해보세요..."></textarea>
      <p id="memoError" class="ajs-error hidden">메모를 입력해주세요</p>
    </div>

    <!-- 태그 -->
    <div class="ajs-section">
      <label class="ajs-label">태그</label>
      <div id="tagContainer" class="ajs-tags"></div>
    </div>

  </div>

  <!-- FOOTER -->
  <div class="ajs-footer">
    <button id="saveBtn" class="ajs-save-btn">저장하기</button>
  </div>

</div>


<!-- AlertDialog (alert-dialog.js DOM 요구사항 100% 준수) -->
<div id="alert-dialog" class="alert-dialog hidden">
  <div class="alert-dialog-overlay"></div>

  <div class="alert-dialog-content">
    <h2 class="alert-title">작성을 취소하시겠습니까?</h2>
    <p class="alert-desc">
      작성 중인 내용이 저장되지 않습니다. 정말로 나가시겠습니까?
    </p>

    <div class="alert-dialog-actions">
      <button id="alert-cancel" class="alert-cancel">계속 작성</button>
      <button id="alert-confirm" class="alert-confirm">나가기</button>
    </div>
  </div>
</div>

<button id="alert-trigger" class="hidden"></button>

<!-- UI Component JS -->
<script src="../js/ui/alert-dialog.js"></script>
<script src="../js/ui/badge.js"></script>

<!-- Page JS -->
<script src="../js/screens/AddJournalScreen.js"></script>

</body>
</html>
