<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Leafy Button Example</title>
  <link rel="stylesheet" href="../../css/ui/button.css" />
</head>
<body style="font-family: Pretendard, sans-serif; background:#FAFAF8; padding:2rem;">
  <h2>✅ Default / Variants</h2>
  <button class="btn btn-default btn-default-size">기본 버튼</button>
  <button class="btn btn-outline btn-default-size">외곽선 버튼</button>
  <button class="btn btn-secondary btn-default-size">보조 버튼</button>
  <button class="btn btn-ghost btn-default-size">투명 버튼</button>
  <button class="btn btn-link btn-default-size">링크 버튼</button>
  <button class="btn btn-destructive btn-default-size">위험 버튼</button>

  <h2 style="margin-top:2rem;">🧩 Sizes</h2>
  <button class="btn btn-default btn-sm">작은 버튼</button>
  <button class="btn btn-default btn-default-size">기본 크기</button>
  <button class="btn btn-default btn-lg">큰 버튼</button>

  <h2 style="margin-top:2rem;">🎨 Icon Button</h2>
  <button class="btn btn-outline btn-icon">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor"
      stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round"
      stroke-linejoin="round"><path d="M5 12h14"></path></svg>
  </button>
</body>
</html>
