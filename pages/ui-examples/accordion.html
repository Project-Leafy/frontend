<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Accordion | Leafy UI</title>
  <link rel="stylesheet" href="../../css/ui/accordion.css" />
</head>
<body>
  <div class="accordion-wrapper">
    <h1 class="accordion-title">Leafy Accordion</h1>

    <div class="accordion" id="accordion">
      <div class="accordion-item">
        <button class="accordion-trigger">
          🌿 식물에게 얼마나 자주 물을 줘야 하나요?
          <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>
        <div class="accordion-content">
          흙이 마를 때마다 물을 주세요. 손가락으로 흙을 눌렀을 때 3~4cm 깊이까지 건조하면 물을 줄 시기입니다.
        </div>
      </div>

      <div class="accordion-item">
        <button class="accordion-trigger">
          🍃 잎이 노랗게 변할 때는 어떻게 해야 하나요?
          <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>
        <div class="accordion-content">
          과습 또는 통풍 부족이 원인일 수 있습니다. 통풍이 잘 되는 밝은 곳으로 옮기고 배수를 확인해 주세요.
        </div>
      </div>

      <div class="accordion-item">
        <button class="accordion-trigger">
          🌸 분갈이는 언제 하는 게 좋나요?
          <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>
        <div class="accordion-content">
          일반적으로 봄철(3~5월)에 하는 것이 좋습니다. 뿌리가 화분 아래로 나오거나 배수가 잘 안될 때 분갈이 시기입니다.
        </div>
      </div>
    </div>
  </div>

  <script src="../js/ui/accordion.js"></script>
</body>
</html>
