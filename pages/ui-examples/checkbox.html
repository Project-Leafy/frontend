<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Leafy Checkbox Example</title>
  <link rel="stylesheet" href="../../css/ui/checkbox.css" />
</head>
<body>
  <div class="checkbox-container">
    <label class="checkbox">
      <input type="checkbox" id="leafyCheck" />
      <span class="checkbox-box" aria-hidden="true">
        <svg class="check-icon" viewBox="0 0 24 24">
          <path
            d="M5 13l4 4L19 7"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
      <span class="checkbox-label">식물 상태 자동 분석 활성화</span>
    </label>
  </div>

  <script src="../../js/ui/checkbox.js"></script>
</body>
</html>
