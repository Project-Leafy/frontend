<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Drawer Example</title>
  <link rel="stylesheet" href="../../css/ui/drawer.css" />
</head>

<body>
  <main class="page">
    <h1 class="page-title">Drawer (top / bottom / left / right)</h1>

    <div class="trigger-row">
      <button class="drawer-trigger" data-direction="top">Open Top Drawer</button>
      <button class="drawer-trigger" data-direction="bottom">Open Bottom Drawer</button>
      <button class="drawer-trigger" data-direction="left">Open Left Drawer</button>
      <button class="drawer-trigger" data-direction="right">Open Right Drawer</button>
    </div>
  </main>

  <!-- Drawer Portal -->
  <div id="drawer-portal"></div>

  <script src="../../js/ui/drawer.js"></script>
</body>
</html>
