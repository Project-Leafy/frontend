<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../../css/ui/slider.css" />
  <title>Slider Example</title>
</head>
<body>

  <div style="padding: 40px; width: 300px;">

    <h3>기본 Slider</h3>
    <div class="slider" data-min="0" data-max="100">
      <div class="slider-track">
        <div class="slider-range"></div>
      </div>
      <div class="slider-thumb"></div>
    </div>

    <br />

    <h3>Range Slider (2 Thumb)</h3>
    <div class="slider" data-min="0" data-max="100">
      <div class="slider-track">
        <div class="slider-range"></div>
      </div>
      <div class="slider-thumb"></div>
      <div class="slider-thumb"></div>
    </div>

  </div>

  <script src="../../js/ui/slider.js"></script>
</body>
</html>
