<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Label Example</title>
  <link rel="stylesheet" href="../../css/ui/label.css" />
</head>
<body>

  <main class="demo-page">
    <h1 class="demo-title">Label Component</h1>

    <div class="label-demo">
      <label class="ui-label">기본 Label</label>
    </div>

    <div class="label-demo group-disabled">
      <label class="ui-label">비활성 Label (group disabled)</label>
    </div>

    <div class="label-demo">
      <input id="test" class="peer-input" type="checkbox" disabled />
      <label for="test" class="ui-label">Peer disabled</label>
    </div>
  </main>

  <script src="../../js/ui/label.js"></script>
</body>
</html>
