<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Progress Example</title>
    <link rel="stylesheet" href="../../css/ui/progress.css" />
  </head>

  <body>
    <main class="page">
      <h1>Progress Demo</h1>

      <!-- Progress Root -->
      <div id="progress-root" class="progress-root" data-value="45">
        <div class="progress-indicator"></div>
      </div>

      <button id="increase" class="btn">+10%</button>
      <button id="decrease" class="btn">-10%</button>
    </main>

    <script src="../../js/ui/progress.js"></script>
  </body>
</html>
