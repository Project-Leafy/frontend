<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Leafy Calendar</title>
  <link rel="stylesheet" href="../../css/ui/button.css" />
  <link rel="stylesheet" href="../../css/ui/calendar.css" />
</head>
<body style="background:#FAFAF8; font-family: Pretendard, sans-serif; display:flex; justify-content:center; padding:3rem;">

  <div class="calendar">
    <div class="calendar-header">
      <button class="nav-btn prev">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"></path></svg>
      </button>
      <div class="month-label">2025년 11월</div>
      <button class="nav-btn next">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"></path></svg>
      </button>
    </div>

    <table class="calendar-table">
      <thead>
        <tr>
          <th>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th>
        </tr>
      </thead>
      <tbody id="calendar-body"></tbody>
    </table>
  </div>

  <script src="../../js/ui/calendar.js"></script>
</body>
</html>
