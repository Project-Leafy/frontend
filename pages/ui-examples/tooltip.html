<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Tooltip Example</title>
  <link rel="stylesheet" href="../../css/ui/tooltip.css" />
</head>

<body style="padding:40px; font-family:Arial;">

  <h2>Tooltip Component (React → HTML/CSS/JS 변환)</h2>

  <div
    data-slot="tooltip"
    data-delay="150"
  >
    <button data-slot="tooltip-trigger" class="tooltip-trigger">
      Hover me
    </button>

    <div
      data-slot="tooltip-content"
      data-state="closed"
      data-side="top"
      class="tooltip-content"
    >
      나는 Tooltip!
      <div class="tooltip-arrow"></div>
    </div>
  </div>

  <script src="../../js/ui/tooltip.js"></script>
</body>
</html>
