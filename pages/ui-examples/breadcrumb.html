<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Breadcrumb UI Example</title>
  <link rel="stylesheet" href="../../css/ui/breadcrumb.css">
  <style>
    body {
      font-family: "Pretendard", sans-serif;
      background-color: #fafaf8;
      color: #111827;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }
    hr {
      border: none;
      border-top: 1px solid #e5e5e0;
      margin: 1.5rem 0;
    }
  </style>
</head>
<body>

  <nav class="breadcrumb" aria-label="breadcrumb">

          <path d="M9 18l6-6-6-6"></path>

      </li>

      <li class="breadcrumb-item">
