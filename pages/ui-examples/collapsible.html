<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Collapsible Example</title>
  <link rel="stylesheet" href="../../css/ui/collapsible.css" />
</head>
<body>

  <div class="collapsible" data-open="false">
    <button class="collapsible-trigger">
      🌿 Leafy 설정 열기
    </button>

    <div class="collapsible-content">
      <p>이 영역은 열고 닫히는 내용입니다.</p>
      <p>나중에 설정 메뉴, FAQ, 세부 옵션 등에 사용 가능합니다.</p>
    </div>
  </div>

  <script src="../../js/ui/collapsible.js"></script>
</body>
</html>
