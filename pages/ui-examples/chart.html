<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Leafy Line Chart Example</title>
  <link rel="stylesheet" href="../../css/ui/chart.css">
</head>
<body>
  <div class="chart-container">
    <div class="chart-header">
      <h2>🌿 토양 수분 변화</h2>
      <p>최근 일주일간의 수분 상태</p>
    </div>
    <canvas id="leafyChart" width="600" height="300"></canvas>
    <div class="chart-legend">
      <span class="legend-dot" style="background-color: #4A7C59;"></span>
      <span>토양 수분</span>
    </div>
  </div>

  <script src="../../js/ui/chart.js"></script>
</body>
</html>
