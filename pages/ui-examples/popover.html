<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>Popover Example</title>
    <link rel="stylesheet" href="../../css/ui/popover.css">
  </head>

  <body>

    <button id="popover-trigger" class="popover-trigger">Open Popover</button>

    <div id="popover-root" class="popover-root">
      <div id="popover-content" class="popover-content hidden">
        <h2 class="popover-title">Popover Title</h2>
        <p class="popover-description">
          This is a popover — converted from Radix TSX.
        </p>
      </div>
    </div>

    <script src="../../js/ui/popover.js"></script>
  </body>
</html>
