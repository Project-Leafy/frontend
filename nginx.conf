# Leafy 프론트 nginx 설정 (이미지에 포함)
#
# 접속 주소(localhost, Tailscale IP 등)와 무관하게 동작하도록 server_name 을 고정하지 않는다.
# 브라우저는 이 nginx 하나에만 접속하고, 경로에 따라 백엔드·MinIO 로 넘긴다.
#   /api/, /login/, /oauth2/, Swagger  -> backend:8080
#   /files/                            -> minio:9000/leafy/  (업로드 사진, 도감 이미지·데이터)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 사진 업로드 허용 크기. 백엔드 multipart 제한(20MB)과 맞춘다. (nginx 기본값은 1MB)
    client_max_body_size 20m;

    # 도커 내부 DNS. 컨테이너 이름을 요청 시점에 찾게 해,
    # backend·minio 가 아직 안 떴어도 nginx 가 기동에 실패하지 않게 한다.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://backend:8080;
    set $minio   http://minio:9000;

    # 1. 프론트엔드 (화면)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. 백엔드 API
    location /api/ {
        proxy_pass $backend;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # 3. Swagger (팀원 API 확인용)
    location ~ ^/(swagger-ui|api-docs|v3/api-docs) {
        proxy_pass $backend;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # 4. 카카오 로그인 (백엔드에서 kakao 프로필을 켰을 때만 동작)
    location ~ ^/(login|oauth2)/ {
        proxy_pass $backend;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # 5. 업로드 파일 (MinIO). 읽기만 허용한다.
    location /files/ {
        limit_except GET HEAD {
            deny all;
        }
        rewrite ^/files/(.*)$ /leafy/$1 break;
        proxy_pass $minio;
        proxy_set_header Host minio:9000;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
    }
}
