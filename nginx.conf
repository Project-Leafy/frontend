server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 모든 요청을 index.html로 돌려보냄 (SPA 라우팅 지원)
    # Vanilla JS라도 URL 경로 이동(/app/main 등)을 쓴다면 이 설정이 필수입니다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # (선택 사항) API 요청이 프론트엔드로 올 경우 백엔드로 넘겨주기 (Reverse Proxy)
    # 이 설정은 나중에 전체 docker-compose에서 처리하므로 여기선 비워둬도 됩니다.
}