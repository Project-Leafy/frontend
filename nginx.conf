server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 프록시 (백엔드 호출 시 필요하면)
    location /api/ {
        proxy_pass http://backend-container-ip:8080/;  # 또는 실제 백엔드 도메인
    }
}