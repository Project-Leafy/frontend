<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Leafy - 로그인</title>

    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/index/index.css">
    <link rel="stylesheet" href="/auth/auth.css">

    <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="app-container">
        <div id="login-screen" class="screen active">
            <div class="login-content">
                <div class="logo-circle">
                    <i data-lucide="sprout"></i>
                </div>
                <h1 class="login-title">식물 성장 일지</h1>
                <p class="login-subtitle">
                    반려식물과 함께하는 특별한 성장 기록
                </p>

                <form id="login-form" class="auth-form" novalidate>
                    <div class="auth-field">
                        <label for="login-id">아이디</label>
                        <input id="login-id" name="loginId" autocomplete="username" autocapitalize="none" required>
                    </div>
                    <div class="auth-field">
                        <label for="login-password">비밀번호</label>
                        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
                    </div>
                    <p id="login-message" class="auth-message" role="alert"></p>
                    <button type="submit" class="auth-btn">로그인</button>
                </form>

                <div class="auth-links">
                    <a href="/auth/signup.html">회원가입</a>
                    <span class="divider">|</span>
                    <a href="/auth/find-id.html">아이디 찾기</a>
                    <span class="divider">|</span>
                    <a href="/auth/reset-password.html">비밀번호 찾기</a>
                </div>

                <div class="login-policy">
                    로그인하시면 서비스 이용약관 및 개인정보처리방침에<br>
                    동의하는 것으로 간주됩니다.
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
    <script type="module">
        import { login, errorMessage } from './assets/js/auth_api.js';

        // 이미 로그인한 상태면 바로 메인으로 보낸다.
        if (localStorage.getItem('accessToken')) {
            window.location.replace('/app/main/main.html');
        }

        const form = document.getElementById('login-form');
        const message = document.getElementById('login-message');
        const button = form.querySelector('button[type="submit"]');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const loginId = form.loginId.value.trim();
            const password = form.password.value;

            if (!loginId || !password) {
                message.textContent = '아이디와 비밀번호를 입력해주세요.';
                return;
            }

            button.disabled = true;
            message.textContent = '';
            const result = await login(loginId, password);
            button.disabled = false;

            if (result.ok && result.data?.access_token) {
                localStorage.setItem('accessToken', result.data.access_token);
                window.location.replace('/app/main/main.html');
                return;
            }
            message.textContent = errorMessage(result, '로그인에 실패했습니다.');
            form.password.value = '';
            form.password.focus();
        });
    </script>
</body>
</html>
