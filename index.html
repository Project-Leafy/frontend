<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Leafy - 로그인</title>
   
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/index/index.css">
   
    <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="app-container">
        <div id="login-screen" class="screen active">
            <div class="login-content">
                <div class="logo-circle">
                    <i data-lucide="sprout"></i>
                </div>
                <h1 class="login-title">식물 성장 일지</h1>
                <p class="login-subtitle">
                    반려식물과 함께하는 특별한 성장 기록
                </p>

                <!-- 여기만 바뀜! 클릭하면 바로 카카오 로그인 창 뜸 -->
                <a href="http://3.38.12.121/login/kakao" class="kakao-login-btn">
                    <span class="kakao-icon">
                        <svg data-lucide="message-circle"></svg>
                    </span>
                    카카오로 시작하기
                </a>

                <div class="login-policy">
                    로그인하시면 서비스 이용약관 및 개인정보처리방침에<br>
                    동의하는 것으로 간주됩니다.
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>

</body>
</html>
