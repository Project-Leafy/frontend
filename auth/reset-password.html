<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Leafy - 비밀번호 찾기</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/index/index.css">
    <link rel="stylesheet" href="/auth/auth.css">
    <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="app-container">
        <div class="screen active">
            <div class="login-content">
                <div class="logo-circle">
                    <i data-lucide="key-round"></i>
                </div>
                <h1 class="login-title">비밀번호 찾기</h1>
                <p class="login-subtitle">아이디와 이메일이 맞으면 새 비밀번호로 바꿔요</p>
                <form id="reset-form" class="auth-form" novalidate>
                    <div class="auth-field">
                        <label for="login-id">아이디</label>
                        <input id="login-id" name="loginId" autocomplete="username" autocapitalize="none" required>
                    </div>
                    <div class="auth-field">
                        <label for="email">이메일</label>
                        <input id="email" name="email" type="email" autocomplete="email" required>
                    </div>
                    <div class="auth-field">
                        <label for="new-password">새 비밀번호</label>
                        <input id="new-password" name="newPassword" type="password" autocomplete="new-password" maxlength="64" required>
                        <span class="hint">영문과 숫자를 포함한 8자 이상</span>
                    </div>
                    <div class="auth-field">
                        <label for="new-password-confirm">새 비밀번호 확인</label>
                        <input id="new-password-confirm" name="newPasswordConfirm" type="password" autocomplete="new-password" maxlength="64" required>
                    </div>
                    <p id="message" class="auth-message" role="alert"></p>
                    <button type="submit" class="auth-btn">비밀번호 바꾸기</button>
                </form>

                <div class="auth-links">
                    <a href="/index.html">로그인</a>
                    <span class="divider">|</span>
                    <a href="/auth/find-id.html">아이디 찾기</a>
                </div>
            </div>
        </div>
    </div>

    <script>lucide.createIcons();</script>
    <script type="module">
        import { resetPassword, errorMessage, PASSWORD_RULE } from '/assets/js/auth_api.js';

        const form = document.getElementById('reset-form');
        const message = document.getElementById('message');
        const submit = form.querySelector('button[type="submit"]');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const loginId = form.loginId.value.trim();
            const email = form.email.value.trim();
            const newPassword = form.newPassword.value;

            if (!loginId || !email) {
                message.textContent = '아이디와 이메일을 입력해주세요.';
                return;
            }
            if (!PASSWORD_RULE.test(newPassword)) {
                message.textContent = '비밀번호는 영문과 숫자를 포함한 8~64자여야 합니다.';
                return;
            }
            if (newPassword !== form.newPasswordConfirm.value) {
                message.textContent = '새 비밀번호 확인이 일치하지 않습니다.';
                return;
            }

            submit.disabled = true;
            message.textContent = '';
            const result = await resetPassword(loginId, email, newPassword);
            submit.disabled = false;

            if (result.ok) {
                alert('비밀번호를 바꿨습니다. 새 비밀번호로 로그인해주세요.');
                window.location.replace('/index.html');
                return;
            }
            message.textContent = errorMessage(result, '비밀번호를 바꾸지 못했습니다.');
        });
    </script>
</body>
</html>
