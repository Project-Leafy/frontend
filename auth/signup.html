<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Leafy - 회원가입</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/index/index.css">
    <link rel="stylesheet" href="/auth/auth.css">
    <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="app-container">
        <div class="screen active">
            <div class="login-content">
                <div class="logo-circle">
                    <i data-lucide="user-plus"></i>
                </div>
                <h1 class="login-title">회원가입</h1>
                <p class="login-subtitle">아이디와 비밀번호로 가입해요</p>
                <form id="signup-form" class="auth-form" novalidate>
                    <div class="auth-field">
                        <label for="login-id">아이디</label>
                        <div class="auth-row">
                            <input id="login-id" name="loginId" autocomplete="username" autocapitalize="none" maxlength="20" required>
                            <button type="button" id="check-id" class="auth-btn secondary">중복 확인</button>
                        </div>
                        <span id="id-hint" class="hint">영문 소문자로 시작하는 4~20자 (소문자·숫자·_)</span>
                    </div>
                    <div class="auth-field">
                        <label for="password">비밀번호</label>
                        <input id="password" name="password" type="password" autocomplete="new-password" maxlength="64" required>
                        <span class="hint">영문과 숫자를 포함한 8자 이상</span>
                    </div>
                    <div class="auth-field">
                        <label for="password-confirm">비밀번호 확인</label>
                        <input id="password-confirm" name="passwordConfirm" type="password" autocomplete="new-password" maxlength="64" required>
                    </div>
                    <div class="auth-field">
                        <label for="email">이메일</label>
                        <input id="email" name="email" type="email" autocomplete="email" required>
                        <span class="hint">아이디·비밀번호를 찾을 때 사용해요</span>
                    </div>
                    <div class="auth-field">
                        <label for="nickname">닉네임</label>
                        <input id="nickname" name="nickname" maxlength="20" required>
                        <span class="hint">아이디를 찾을 때 이메일과 함께 확인해요</span>
                    </div>
                    <p id="message" class="auth-message" role="alert"></p>
                    <button type="submit" class="auth-btn">가입하기</button>
                </form>

                <div class="auth-links">
                    <a href="/index.html">로그인으로 돌아가기</a>
                </div>
            </div>
        </div>
    </div>

    <script>lucide.createIcons();</script>
    <script type="module">
        import { signup, checkLoginId, errorMessage, LOGIN_ID_RULE, PASSWORD_RULE } from '/assets/js/auth_api.js';

        const form = document.getElementById('signup-form');
        const message = document.getElementById('message');
        const idHint = document.getElementById('id-hint');
        const submit = form.querySelector('button[type="submit"]');
        let checkedLoginId = null; // 중복 확인을 통과한 아이디

        form.loginId.addEventListener('input', () => {
            checkedLoginId = null;
            idHint.className = 'hint';
            idHint.textContent = '영문 소문자로 시작하는 4~20자 (소문자·숫자·_)';
        });

        document.getElementById('check-id').addEventListener('click', async () => {
            const loginId = form.loginId.value.trim();
            if (!LOGIN_ID_RULE.test(loginId)) {
                idHint.className = 'hint bad';
                idHint.textContent = '영문 소문자로 시작하는 4~20자(소문자·숫자·_)로 입력해주세요.';
                return;
            }
            const result = await checkLoginId(loginId);
            if (!result.ok) {
                idHint.className = 'hint bad';
                idHint.textContent = errorMessage(result, '확인하지 못했습니다.');
                return;
            }
            if (result.data.available) {
                checkedLoginId = loginId;
                idHint.className = 'hint ok';
                idHint.textContent = '사용할 수 있는 아이디입니다.';
            } else {
                idHint.className = 'hint bad';
                idHint.textContent = '이미 사용 중인 아이디입니다.';
            }
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const loginId = form.loginId.value.trim();
            const password = form.password.value;
            const email = form.email.value.trim();
            const nickname = form.nickname.value.trim();

            if (checkedLoginId !== loginId) {
                message.textContent = '아이디 중복 확인을 해주세요.';
                return;
            }
            if (!PASSWORD_RULE.test(password)) {
                message.textContent = '비밀번호는 영문과 숫자를 포함한 8~64자여야 합니다.';
                return;
            }
            if (password !== form.passwordConfirm.value) {
                message.textContent = '비밀번호 확인이 일치하지 않습니다.';
                return;
            }
            if (!email || !form.email.checkValidity()) {
                message.textContent = '이메일을 올바르게 입력해주세요.';
                return;
            }
            if (nickname.length < 2) {
                message.textContent = '닉네임은 2~20자로 입력해주세요.';
                return;
            }

            submit.disabled = true;
            message.textContent = '';
            const result = await signup(loginId, password, email, nickname);
            submit.disabled = false;

            if (result.ok) {
                alert('가입이 완료되었습니다. 로그인해주세요.');
                window.location.replace('/index.html');
                return;
            }
            message.textContent = errorMessage(result, '가입하지 못했습니다.');
        });
    </script>
</body>
</html>
