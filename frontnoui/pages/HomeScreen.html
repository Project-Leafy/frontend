<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 식물</title>

  <!-- Global & Home CSS -->
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/HomeScreen.css" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <div id="app">

    <!-- ======= HEADER ======= -->
    <div class="hs-header">
      <div class="hs-header-top">
        <h2 style="font-size: 20px; font-weight: 600; margin: 0;">내 식물</h2>
        <div>
          <button id="notifications-btn" class="hs-icon">
            <i data-lucide="bell"></i>
          </button>
          <button id="profile-btn" class="hs-icon">
            <i data-lucide="user"></i>
          </button>
        </div>
      </div>
      <p id="plant-count" class="subtitle"></p>
    </div>

    <!-- ======= BODY ======= -->
    <div class="hs-container">

      <!-- 식물 등록 버튼 -->
      <button id="add-plant-btn" class="hs-add-btn">
        <i data-lucide="plus-circle" style="margin-right: 6px;"></i>
        식물 등록하기
      </button>

      <!-- 식물 리스트 -->
      <div id="plant-list"></div>
    </div>

  </div>
  <!-- 삭제 확인 Dialog -->
<div id="deleteDialog" class="hs-dialog-backdrop hidden">
  <div class="hs-dialog">
    <h2 style="font-size:18px; font-weight:600; margin:0 0 8px 0;">식물을 삭제할까요?</h2>
    <p style="margin:0; color:#6b7280; font-size:14px;">
      삭제하면 해당 식물과 모든 기록이 사라집니다.
    </p>

    <div class="hs-dialog-buttons">
      <button id="dialogCancel" class="hs-cancel">취소</button>
      <button id="dialogConfirm" class="hs-confirm">삭제</button>
    </div>
  </div>
</div>

  <!-- 화면 JS -->
  <script src="../js/screens/HomeScreen.js"></script>
</body>
</html>
