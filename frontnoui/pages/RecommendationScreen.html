<!DOCTYPE html>
<html lang="ko">
</head>
<body>
  <div class="app-container">
    <!-- 헤더 영역 -->
    <div class="header">
      <div>
        <h1 class="header-title">맞춤 식물 추천</h1>
        <p class="subtitle">간단한 질문으로 나에게 맞는 식물을 찾아보세요</p>
      </div>

      <button id="profileBtn" class="icon-btn">
        <i data-lucide="user"></i>
      </button>
    </div>

    <!-- 내용 영역 -->
    <div class="content">
      <div id="surveyContainer" class="survey-section"></div>
    </div>

    <!-- 하단 고정 버튼 -->
    <div class="bottom-bar">
      <button id="submitBtn" class="submit-btn disabled" disabled>
        추천 받기
        <i data-lucide="arrow-right"></i>
      </button>
    </div>
  </div>
</body>
</html>
