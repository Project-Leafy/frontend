<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>식물 등록</title>

  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/PlantRegistrationFlow.css" />

  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-container">

    <!-- 🔹 1단계: 촬영 화면 -->
    <section id="step1" class="screen active">
      <header class="header">
        <button id="back1" class="icon-btn">
          <i data-lucide="arrow-left"></i>
        </button>
        <div class="header-text">
          <h1>식물 등록</h1>
          <p>1/3 단계</p>
        </div>
      </header>

      <div class="center-area">
        <div class="circle-icon">
          <i data-lucide="camera"></i>
        </div>
        <h2>식물 사진을 촬영해주세요</h2>
        <p class="sub">
          식물 전체가 잘 보이도록<br />밝은 곳에서 촬영해주세요
        </p>

        <button id="takePhoto" class="main-btn">
          <i data-lucide="camera"></i> 카메라로 촬영하기
        </button>
        <button id="selectFromAlbum" class="sub-btn">
          앨범에서 선택하기
        </button>
      </div>
    </section>

    <!-- 🔹 2단계: 분석 화면 -->
    <section id="step2" class="screen">
      <header class="header">
        <button id="back2" class="icon-btn">
          <i data-lucide="arrow-left"></i>
        </button>
        <div class="header-text">
          <h1>식물 등록</h1>
          <p>2/3 단계</p>
        </div>
      </header>

      <div class="content">
        <div class="image-box">
          <img id="previewImage" />
        </div>

        <div class="analysis-box">
          <div class="analysis-icon">
            <i data-lucide="check"></i>
          </div>
          <h3>분석 완료!</h3>
          <p class="small">Plant.id AI 분석 결과</p>

          <div class="analysis-result">
            <p class="plant-name" id="analysisName"></p>
            <p class="scientific" id="analysisScientific"></p>
            <div class="confidence-bar">
              <div id="confidenceLevel"></div>
              <span id="confidencePercent"></span>
            </div>
          </div>
        </div>

        <button id="nextToStep3" class="main-btn">맞아요, 다음으로</button>
        <button id="retake" class="sub-btn">다시 촬영하기</button>
      </div>
    </section>

    <!-- 🔹 3단계: 정보 입력 -->
    <section id="step3" class="screen">
      <header class="header">
        <button id="back3" class="icon-btn">
          <i data-lucide="arrow-left"></i>
        </button>
        <div class="header-text">
          <h1>식물 등록</h1>
          <p>3/3 단계</p>
        </div>
      </header>

      <div class="content">
        <div class="image-wide">
          <img id="finalImage" />
        </div>

        <div class="field">
          <label>식물 종류</label>
          <input id="species" type="text" readonly />
        </div>

        <div class="field">
          <label>애칭 <span>(선택)</span></label>
          <input id="nickname" type="text" placeholder="예: 초록이, 행복이" />
        </div>

        <div class="field">
          <label>입양일</label>
          <input id="adoptionDate" type="date" />
        </div>
      </div>

      <footer class="footer">
        <button id="completeBtn" class="main-btn bottom-btn">등록 완료</button>
      </footer>
    </section>

  </div>

  <script src="../js/screens/PlantRegistrationFlow.js"></script>
</body>
</html>
