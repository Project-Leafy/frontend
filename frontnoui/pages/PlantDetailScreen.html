<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>식물 상세</title>

  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/PlantDetailScreen.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script defer src="../js/screens/PlantDetailScreen.js"></script>
</head>

<body>
  <main class="screen">
    <section id="top-image" class="plant-image-section">
      <img id="plant-img" alt="" />
      <div class="shadow-overlay"></div>

      <button id="back-btn" class="icon-btn abs-left">
        <i data-lucide="arrow-left"></i>
      </button>

      <button id="info-btn" class="icon-btn abs-right">
        <i data-lucide="info"></i>
      </button>

      <div class="plant-title">
        <h1 id="plant-nickname"></h1>
        <p id="plant-name"></p>
      </div>
    </section>

    <section class="info-container">
      <div class="info-card">
        <div>
          <p class="label">함께한 지</p>
          <p id="days-since" class="value"></p>
        </div>
        <div>
          <p class="label">입양일</p>
          <p id="adoption-date" class="value"></p>
        </div>
      </div>

      <div class="journal-header">
        <h2>성장 일지</h2>
        <button id="add-journal-btn" class="action-btn">
          <i data-lucide="plus"></i>
          기록 추가
        </button>
      </div>

      <div class="journal-list" id="journal-list"></div>
    </section>
  </main>

  <script>lucide.createIcons()</script>
</body>
</html>
