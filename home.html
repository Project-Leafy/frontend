# 1. 로그인 페이지 (사용자가 정의한 '홈')
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leafy - 로그인</title>
    <link rel="stylesheet" href="/assets/css/style.css">

</head>

<body>
    <div id="app-container">
        <div id="login-screen" class="screen active">
            <div class="login-content">
                <div class="logo-circle">
                    <svg data-lucide="sprout"></svg>
                </div>
                <h1 class="login-title">Leafy</h1>
                <p class="login-subtitle">
                    반려식물과 함께하는 건강한 일상,<br>
                    Leafy가 함께합니다.
                </p>
                <a href="http://localhost:8080/login/kakao" class="kakao-login-btn">
                    <span class="kakao-icon">
                        <svg data-lucide="message-circle"></svg>
                    </span>
                    카카오로 시작하기
                </a>
                <p class="legal-text">
                    로그인 시 <a href="#" style="color: var(--text-grey); text-decoration: underline;">이용약관</a> 및
                    <a href="#" style="color: var(--text-grey); text-decoration: underline;">개인정보처리방침</a>에 동의하게 됩니다.
                </p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>

    <script>
        // (선택 사항) 만약 이미 토큰을 가지고 있다면, 로그인 페이지 대신 메인 페이지로 보낸다.
        (function () {
            const token = localStorage.getItem('accessToken');
            if (token) {
                window.location.replace('/app/main.html');
            }
        })();
    </script>
</body>

</html>
