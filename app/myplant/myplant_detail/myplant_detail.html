<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>내 식물 상세정보</title>
    <link rel="icon" href="../../../assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="myplant_detail.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="app-container">
        
        <div id="loading-spinner" class="loading-active">
            <div class="spinner"></div>
        </div>

        <div id="plant-data-container" style="display: none;">
            
            <header class="header">
                <button id="backBtn" class="icon-btn" onclick="history.back()">
                    <i data-lucide="arrow-left"></i>
                </button>
                <h1 class="header-title" id="plant-nickname-header">상세 정보</h1>
                <button class="icon-btn" style="opacity: 0; cursor: default;">
                    <i data-lucide="more-vertical"></i> </button>
            </header>

            <main class="main-content">
                
                <section class="plant-hero-section">
                    <img id="plant-image" src="https://placehold.co/400x400" alt="식물 이미지">
                    
                    <div class="input-wrapper">
                        <input type="text" id="plant-nickname-input" placeholder="닉네임 (예: 초록이)">
                        <button id="save-nickname-btn" class="save-btn">변경</button>
                    </div>
                </section>

                <section class="info-card date-card">
                    <div class="date-label">
                        <i data-lucide="calendar-heart" size="20" color="#4A7C59"></i>
                        <span>함께한 날</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <input type="date" id="plant-adoption-date-input" style="border: 1px solid #ddd; padding: 4px; border-radius: 6px; font-size: 13px;">
                        <button id="save-date-btn" class="save-btn" style="padding: 4px 10px; font-size: 12px;">저장</button>
                    </div>
                </section>

                <section class="info-card intro-box">
                    <div class="section-header">
                        <i data-lucide="sprout" size="20" color="#064E3B"></i>
                        <h3>식별 정보</h3>
                    </div>
                    
                    <div class="dropdown-container">
                        <label for="suggestions-dropdown" class="dropdown-label">AI 분석 결과</label>
                        <select id="suggestions-dropdown"></select>
                    </div>

                    <div id="suggestion-detail">
                        </div>
                </section>

                <section>
                    <div class="section-header">
                        <i data-lucide="stethoscope" size="20" color="#4A7C59"></i>
                        <h3>건강 상태</h3>
                    </div>
                    <div class="info-card">
                        <div id="disease-info">
                            </div>
                    </div>
                </section>

                <section>
                    <div class="section-header">
                        <i data-lucide="clipboard-list" size="20" color="#4A7C59"></i>
                        <h3>상세 분석</h3>
                    </div>
                    <div class="info-card">
                        <div id="other-info">
                            </div>
                    </div>
                </section>

            </main> </div> </div>

    <script type="module">
        import { getMyPlantDetail } from '../../plant/plant_api.js';
        import { fetchApi } from '/assets/js/core_api.js'; // 경로 수정
        import { getDiagnosisHistory } from '../../diagnosis/diagnosis_api.js'; // 새로 추가

        // --- DOM Elements ---
        const loadingSpinner = document.getElementById('loading-spinner');
        const dataContainer = document.getElementById('plant-data-container');
        const plantImage = document.getElementById('plant-image');
        const plantNicknameInput = document.getElementById('plant-nickname-input');
        const plantAdoptionDateInput = document.getElementById('plant-adoption-date-input');
        const suggestionsDropdown = document.getElementById('suggestions-dropdown');
        const suggestionDetail = document.getElementById('suggestion-detail');
        const diseaseInfoContainer = document.getElementById('disease-info');
        const otherInfoContainer = document.getElementById('other-info');

        let currentPlantId = null;

        // --- Render Functions ---
        
        function renderBaseInfo(plant) {
            plantNicknameInput.value = plant.nickname || '';
            plantImage.src = plant.image_url || 'https://placehold.co/400x400';
            const adoptionDate = plant.adoption_date || plant.adoptionDate;
            if (adoptionDate) {
                plantAdoptionDateInput.value = adoptionDate;
            }
        }

        function renderSuggestions(suggestions) {
            if (!suggestions || suggestions.length === 0) {
                suggestionsDropdown.innerHTML = '<option value="">식별 정보 없음</option>';
                suggestionsDropdown.disabled = true;
                suggestionDetail.innerHTML = '<p class="empty-state">AI 식별 정보가 없습니다.</p>';
                return;
            }

            suggestionsDropdown.innerHTML = '';
            suggestionsDropdown.dataset.suggestions = JSON.stringify(suggestions);

            suggestions.forEach((suggestion, index) => {
                const percentage = (suggestion.probability * 100).toFixed(1);
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${suggestion.name} (${percentage}%)`;
                suggestionsDropdown.appendChild(option);
            });

            suggestionsDropdown.addEventListener('change', (e) => {
                const selectedIndex = e.target.value;
                renderSuggestionDetail(suggestions[selectedIndex]);
            });
            renderSuggestionDetail(suggestions[0]);
        }

                // [보강됨] 식별 상세 정보 렌더링 함수 (null 안전 처리)
        function renderSuggestionDetail(suggestion) {
            // 1. suggestion 객체가 아예 없는 경우 방어
            if (!suggestion) {
                suggestionDetail.innerHTML = '<p class="empty-state">선택된 식별 정보가 없습니다.</p>';
                return;
            }

            // 2. 필드별 안전 처리 (null, undefined, 비문자열 방지)
            
            // A. 이름 (common_name 우선, 없으면 name, 둘 다 없으면 기본값)
            const rawCommonName = suggestion.common_name || suggestion.name;
            const commonName = rawCommonName ? String(rawCommonName).trim() : '이름 없음';

            // B. 학명 (scientific_name)
            const scientificName = suggestion.scientific_name ? String(suggestion.scientific_name).trim() : '';

            // C. 상세 설명 (details.description.value 처럼 깊은 객체 접근 시 안전하게 처리)
            let description = '상세 설명이 없습니다.';
            // 옵셔널 체이닝(?.)을 사용하여 중간에 값이 없어도 에러가 나지 않도록 함
            if (suggestion.details?.description?.value) {
                description = String(suggestion.details.description.value).trim();
            } else if (suggestion.description) {
                // API 버전에 따라 구조가 다를 수 있어 1차원 description도 체크
                description = String(suggestion.description).trim();
            }

            // 3. HTML 렌더링
            suggestionDetail.innerHTML = `
                <div class="suggestion-info">
                    <div class="suggestion-header">
                        <div class="plant-names">
                            <h4>${commonName}</h4>
                            <p>${scientificName}</p>
                        </div>
                    </div>
                    <p class="suggestion-desc">${description}</p>
                </div>
            `;
        }
        
        // [수정됨] 진단 기록 렌더링 함수
        function renderDiagnosisHistory(records) {
            if (!records || !Array.isArray(records) || records.length === 0) {
                diseaseInfoContainer.innerHTML = '<p class="empty-state">아직 진단 기록이 없습니다.</p>';
                return;
            }

            diseaseInfoContainer.innerHTML = '';
            
            records.forEach(record => {
                // --- [수정] 변수명을 스네이크 케이스로 변경 ---

                // A. 날짜 처리
                let diagnosisDateStr = '-';
                // record.diagnosisDatetime -> record.diagnosis_datetime
                if (record.diagnosis_datetime) { 
                    try {
                        diagnosisDateStr = new Date(record.diagnosis_datetime).toLocaleDateString('ko-KR');
                    } catch (e) {
                        console.warn('날짜 변환 오류:', e);
                        diagnosisDateStr = '날짜 오류';
                    }
                }

                // B. 질병 이름 처리
                // record.diseaseName -> record.disease_name
                const rawName = record.disease_name ? String(record.disease_name) : '';
                const isHealthy = rawName.toLowerCase() === 'healthy';
                
                const displayName = isHealthy ? '건강함' : (rawName || '판독 불가');

                // C. 정확도(확률) 처리
                let probabilityStr = '0';
                // record.diseaseProbability -> record.disease_probability
                if (record.disease_probability !== null && record.disease_probability !== undefined) {
                    probabilityStr = (Number(record.disease_probability) * 100).toFixed(0);
                }

                // HTML 생성 (여기는 변경 없음)
                const recordEl = document.createElement('div');
                recordEl.className = 'diagnosis-record';
                
                recordEl.innerHTML = `
                    <div class="record-header">
                        <span class="record-date">${diagnosisDateStr}</span>
                        <span class="record-status ${isHealthy ? 'healthy' : 'disease'}">
                            ${displayName}
                        </span>
                    </div>
                    <div class="record-body">
                        정확도: ${probabilityStr}%
                    </div>
                `;
                diseaseInfoContainer.appendChild(recordEl);
            });
        }

        // --- Data Fetching Functions ---

        // [신규] 진단 기록 불러오기
        async function loadDiagnosisHistory(plantId) {
            try {
                const records = await getDiagnosisHistory(plantId);
                renderDiagnosisHistory(records);
            } catch (error) {
                console.error("진단 기록 로드 실패:", error);
                diseaseInfoContainer.innerHTML = '<p class="empty-state" style="color: #EF4444;">기록을 불러오는 중 오류가 발생했습니다.</p>';
            }
        }
        
        async function loadPlantDetail() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const plantId = urlParams.get('id');
                if (!plantId) throw new Error('식물 ID가 없습니다.');

                currentPlantId = plantId;
                const plantDetail = await getMyPlantDetail(plantId);
                
                // ✅ 백엔드가 DTO에서 이미 List로 변환해서 줍니다. 바로 쓰면 됩니다.
                let suggestions = plantDetail.identification_candidates || []; // DTO 변수명(identification_candidates) 확인

                renderBaseInfo(plantDetail);
                renderSuggestions(suggestions);
                
                // [신규] 진단 기록 로드 호출
                await loadDiagnosisHistory(plantId);

                if (otherInfoContainer) otherInfoContainer.innerHTML = '<p class="empty-state">추가 분석 데이터가 없습니다.</p>';

            } catch (error) {
                console.error('Error:', error);
                dataContainer.innerHTML = `<div class="error-message">데이터를 불러오지 못했습니다.<br><span style="font-size:12px; color:#666;">${error.message}</span></div>`;
            } finally {
                loadingSpinner.classList.remove('loading-active');
                dataContainer.style.display = 'block';
                lucide.createIcons();
            }
        }

        // --- Event Listeners ---

        async function updatePlantData(plantId, payload) {
            try {
                const response = await fetchApi(`/api/v1/my-plants/${plantId}`, {
                    method: 'PATCH',
                    body: JSON.stringify(payload)
                });
                if (!response.ok) throw new Error('서버 응답 오류');
                return true;
            } catch (error) {
                console.error('데이터 업데이트 실패:', error);
                alert('저장에 실패했습니다.');
                return false;
            }
        }

        document.getElementById('save-nickname-btn').addEventListener('click', async () => {
            const newNickname = plantNicknameInput.value.trim();
            if (!newNickname) {
                alert('닉네임을 입력해주세요.');
                return;
            }
            if (await updatePlantData(currentPlantId, { nickname: newNickname })) {
                alert('닉네임이 변경되었습니다!');
            }
        });

        document.getElementById('save-date-btn').addEventListener('click', async () => {
            const newDate = plantAdoptionDateInput.value;
            if (!newDate) {
                alert('날짜를 선택해주세요.');
                return;
            }
            // 🚨 [수정] adoptionDate -> adoption_date (백엔드 DTO가 snake_case를 기다림)
            if (await updatePlantData(currentPlantId, { adoption_date: newDate })) { 
                alert('입양일이 저장되었습니다!');
            }
        });

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', loadPlantDetail);
    </script>
</body>
</html>
