<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>식물 상세 - 성장 일지</title>
    
    <link rel="icon" href="../../../assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="myplant_diary.css">
    
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <main class="screen">
    <section id="top-image" class="plant-image-section">
      <img id="plant-img" src="https://placehold.co/600x800" alt="식물 이미지" />
      <div class="shadow-overlay"></div>

      <button id="back-btn" class="icon-btn abs-left" onclick="location.href='/app/main/main.html'">
        <i data-lucide="arrow-left"></i>
      </button>

      <button id="info-btn" class="icon-btn abs-right">
        <i data-lucide="info"></i>
      </button>

      <div class="plant-title">
        <h1 id="plant-nickname">로딩 중...</h1>
        <p id="plant-name"></p>
      </div>
    </section>

    <section class="info-container">
      <div class="info-card">
        <div>
          <p class="label">함께한 지</p>
          <p id="days-since" class="value">-일</p>
        </div>
        <div>
          <p class="label">입양일</p>
          <p id="adoption-date" class="value">-</p>
        </div>
      </div>

      <div class="journal-header">
        <h2>성장 일지</h2>
        <button id="add-journal-btn" class="action-btn">
          <i data-lucide="plus" width="16"></i>
          기록 추가
        </button>
      </div>

      <div class="journal-list" id="journal-list">
         <div class="empty-message">
             아직 작성된 성장 일지가 없어요.<br>
             (백엔드 기능 준비 중)
         </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { getMyPlantDetail } from '../../plant/plant_api.js';

    const plantImg = document.getElementById('plant-img');
    const plantNickname = document.getElementById('plant-nickname');
    const plantName = document.getElementById('plant-name');
    const daysSince = document.getElementById('days-since');
    const adoptionDateEl = document.getElementById('adoption-date');
    const addJournalBtn = document.getElementById('add-journal-btn');

    // D-Day 계산 함수
    function calculateDaysSince(dateString) {
        if (!dateString) return 0;
        const start = new Date(dateString);
        const today = new Date();
        const diffTime = Math.abs(today - start);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
        return diffDays; 
    }

    // 데이터 로드 함수
    async function loadPlantDetail() {
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const plantId = urlParams.get('id');

            if (!plantId) {
                alert('잘못된 접근입니다.');
                window.location.href = '/app/main/main.html';
                return;
            }

            const plant = await getMyPlantDetail(plantId);
            console.log('식물 상세 정보:', plant);

            // [수정됨] 식별 후보 파싱하여 1순위 이름 가져오기
            let suggestions = plant.identification_candidates || [];
            if (typeof suggestions === 'string') {
                try {
                    suggestions = JSON.parse(suggestions);
                } catch (e) {
                    console.warn("식별 후보 파싱 실패", e);
                    suggestions = [];
                }
            }

            // 우선순위: 1순위 후보 이름 > common_name > plant_species_name > 기본값
            let speciesName = '식물 종류 미상';
            if (suggestions.length > 0 && suggestions[0].name) {
                speciesName = suggestions[0].name;
            } else if (plant.common_name) {
                speciesName = plant.common_name;
            } else if (plant.plant_species_name) {
                speciesName = plant.plant_species_name;
            }

            const nickname = plant.nickname || '이름 없음';
            const imageUrl = plant.image_url || 'https://placehold.co/600x800';
            const adoptionDate = plant.adoption_date || plant.adoptionDate;

            // 화면 업데이트
            plantNickname.textContent = nickname;
            plantName.textContent = speciesName; // 1순위 이름 적용
            plantImg.src = imageUrl;

            if (adoptionDate) {
                adoptionDateEl.textContent = adoptionDate;
                const dDay = calculateDaysSince(adoptionDate);
                daysSince.textContent = `${dDay}일째`;
            } else {
                adoptionDateEl.textContent = '미등록';
                daysSince.textContent = '-';
            }

        } catch (error) {
            console.error('데이터 로드 실패:', error);
            alert('식물 정보를 불러오는데 실패했습니다.');
        }
    }

    addJournalBtn.addEventListener('click', () => {
        alert('📝 성장 일지 기록 기능은 곧 업데이트될 예정입니다!');
    });

    document.getElementById('info-btn').addEventListener('click', () => {
        const currentQuery = window.location.search; 
        if (!currentQuery) return;
        window.location.href = `/app/myplant/myplant_detail/myplant_detail.html${currentQuery}`;
    });

    document.addEventListener('DOMContentLoaded', () => {
        loadPlantDetail();
        lucide.createIcons();
    });
  </script>
</body>
</html>
