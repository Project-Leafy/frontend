<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="../../../assets/images/favicon.svg" type="image/svg+xml">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>성장 기록 상세</title>
    
    <!-- 기존 myplant_diary.css는 이제 필요 없음 (버그 원인 제거) -->
    <!-- <link rel="stylesheet" href="../myplant_diary/myplant_diary.css"> -->
    
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
            background: #FAFAF8;
            min-height: 100vh;
        }
        
        .screen {
            max-width: 430px;
            margin: 0 auto;
            background: #FAFAF8;
            min-height: 100vh;
        }

        /* 헤더 */
        .detail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: white;
            border-bottom: 1px solid #E5E5E0;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .detail-header button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            transition: background 0.2s;
        }

        .detail-header button:hover {
            background: #F5F5F3;
        }

        .detail-header button:active {
            transform: scale(0.95);
        }

        .detail-header .header-title {
            font-size: 18px;
            font-weight: 600;
            color: #2C3E2F;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        /* 내용 영역 */
        .detail-content {
            padding: 24px 20px 100px;
            background: #FAFAF8;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .info-row p:first-child {
            color: #4A7C59;
            font-weight: 600;
        }

        .info-row p:last-child {
            color: #9CA3AF;
        }

        /* 이미지 갤러리 */
        .image-gallery {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }

        .image-wrapper {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 16px;
            overflow: hidden;
            background: #f0f0f0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 메모 카드 */
        .memo-card {
            background: white;
            border: 1px solid #E5E5E0;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tag-badge {
            background: #E8F4EC;
            color: #4A7C59;
            font-size: 13px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 999px;
        }

        .memo-text {
            color: #2C3E2F;
            line-height: 1.7;
            white-space: pre-wrap;
            font-size: 15px;
        }

        /* 모달 */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-box {
            background: white;
            width: 90%;
            max-width: 320px;
            border-radius: 20px;
            padding: 24px;
            text-align: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .modal-desc {
            color: #6B7280;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .btn-cancel, .btn-delete {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 15px;
        }

        .btn-cancel {
            background: #F3F4F6;
            color: #374151;
        }

        .btn-delete {
            background: #EF4444;
            color: white;
        }

        /* --- Edit Mode Styles --- */
        .custom-textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            font-size: 15px;
            border-radius: 12px;
            border: 1px solid #D1D5DB;
            resize: vertical;
            min-height: 120px;
            line-height: 1.6;
            font-family: inherit;
        }

        .tag-edit-btn {
            background: #F3F4F6;
            color: #4B5563;
            border: 1px solid #E5E7EB;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .tag-edit-btn[data-active="true"] {
            background: #D1FAE5;
            color: #064E3B;
            border-color: #A7F3D0;
            font-weight: 600;
        }
    </style>

    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="screen">
        <header class="detail-header">
            <button id="backBtn">
                <i data-lucide="arrow-left" color="#6B7280" size="22"></i>
            </button>
            <h1 class="header-title">성장 기록</h1>
            <div>
                <button id="editBtn">
                    <i data-lucide="edit" color="#6B7280" size="20"></i>
                </button>
                <button id="deleteBtn">
                    <i data-lucide="trash-2" color="#EF4444" size="20"></i>
                </button>
            </div>
        </header>

        <main class="detail-content">
            <div class="info-row">
                <p id="plantNickname" style="color:#4A7C59;font-weight:600;">-</p>
                <p id="recordDate" style="color:#9CA3AF;font-size:14px;">-</p>
            </div>

            <div id="imageGallery" class="image-gallery"></div>

            <div class="memo-card">
                <div id="tagContainer" class="tag-list"></div>
                <p id="memoText" class="memo-text"></p>
            </div>
        </main>
    </div>

    <div id="deleteModal" class="modal-overlay">
        <div class="modal-box">
            <h3 class="modal-title">기록을 삭제하시겠습니까?</h3>
            <p class="modal-desc">이 성장 기록이 영구적으로 삭제됩니다.<br>이 작업은 취소할 수 없습니다.</p>
            <div class="modal-actions">
                <button id="modalCancel" class="btn-cancel">취소</button>
                <button id="modalConfirm" class="btn-delete">삭제</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { getJournalDetail, deleteJournal, updateGrowthJournal } from './myplant_journal_api.js';

        // --- DOM Elements ---
        const urlParams = new URLSearchParams(window.location.search);
        const recordId = urlParams.get('recordId');
        
        const backBtn = document.getElementById('backBtn');
        const editBtn = document.getElementById('editBtn');
        const deleteBtn = document.getElementById('deleteBtn');
        
        const plantNicknameEl = document.getElementById('plantNickname');
        const recordDateEl = document.getElementById('recordDate');
        const imageGalleryEl = document.getElementById('imageGallery');
        const tagContainerEl = document.getElementById('tagContainer');
        const memoTextEl = document.getElementById('memoText');
        const deleteModal = document.getElementById('deleteModal');

        // --- State ---
        let isEditMode = false;
        let currentJournal = null;

        // --- Render Functions ---
        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            const weekDays = ['일', '월', '화', '수', '목', '금', '토'];
            return `${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일 (${weekDays[date.getDay()]})`;
        }
        
        function renderViewMode() {
            if (!currentJournal) return;
            
            // 데이터 채우기
            plantNicknameEl.textContent = "나의 반려식물"; // 닉네임은 상세조회에 없으므로 고정
            recordDateEl.textContent = formatDate(currentJournal.recordDate);
            
            // 이미지 렌더링
            imageGalleryEl.innerHTML = '';
            if (currentJournal.photoUrl) {
                const div = document.createElement('div');
                div.className = 'image-wrapper';
                div.innerHTML = `<img src="${currentJournal.photoUrl}" onerror="this.style.display='none'">`;
                imageGalleryEl.appendChild(div);
            }
            
            // 태그 및 메모 렌더링 (수정 모드에서 사용된 input 제거)
            tagContainerEl.innerHTML = `
                ${currentJournal.watered ? '<span class="tag-badge">#물주기</span>' : ''}
                ${currentJournal.repotted ? '<span class="tag-badge">#분갈이</span>' : ''}
                ${currentJournal.pruned ? '<span class="tag-badge">#가지치기</span>' : ''}
                ${currentJournal.fertilized ? '<span class="tag-badge">#비료</span>' : ''}
            `;
            memoTextEl.innerHTML = `<p class="memo-text">${currentJournal.memo || "기록된 메모가 없습니다."}</p>`;

            // 버튼 아이콘 및 기능 설정
            editBtn.innerHTML = `<i data-lucide="edit" color="#6B7280" size="20"></i>`;
            deleteBtn.innerHTML = `<i data-lucide="trash-2" color="#EF4444" size="20"></i>`;
            deleteBtn.style.display = 'block'; // 삭제 버튼 보이기
            lucide.createIcons();
        }

        function renderEditMode() {
            // 메모 수정용 textarea
            memoTextEl.innerHTML = `<textarea id="memoEdit" class="custom-textarea" style="height: 150px;">${currentJournal.memo || ''}</textarea>`;

            // 태그 수정용 버튼
            const allTags = [
                { key: 'watered', name: '물주기' },
                { key: 'repotted', name: '분갈이' },
                { key: 'pruned', name: '가지치기' },
                { key: 'fertilized', name: '비료' }
            ];
            tagContainerEl.innerHTML = allTags.map(tag => `
                <button class="tag-edit-btn" data-tag="${tag.key}" data-active="${currentJournal[tag.key]}">
                    #${tag.name}
                </button>
            `).join('');

            // 버튼 아이콘 변경
            editBtn.innerHTML = `<i data-lucide="save" color="#4A7C59" size="20"></i>`; // 저장 아이콘
            deleteBtn.innerHTML = `<i data-lucide="x" color="#6B7280" size="22"></i>`; // 취소(X) 아이콘
            lucide.createIcons();
        }

        // --- Event Handlers & Logic ---
        function toggleEditMode(forceState) {
            isEditMode = (forceState !== undefined) ? forceState : !isEditMode;
            
            if (isEditMode) {
                renderEditMode();
            } else {
                renderViewMode();
            }
        }
        
        async function loadDetail() {
            if (!recordId) return history.back();
            try {
                const journal = await getJournalDetail(recordId);
                currentJournal = journal; // 원본 데이터 저장
                renderViewMode();
            } catch (error) {
                console.error(error);
                alert('일지 정보를 불러오는데 실패했습니다.');
                history.back();
            }
        }
        
        async function handleSave() {
            const memo = document.getElementById('memoEdit').value;
            const activeTags = {};
            document.querySelectorAll('.tag-edit-btn').forEach(btn => {
                const key = btn.dataset.tag;
                activeTags[key] = btn.dataset.active === 'true';
            });
            
            const updateData = {
                memo: memo,
                ...activeTags
                // 날짜, 사진 등 다른 필드는 수정하지 않음
            };

            try {
                await updateGrowthJournal(recordId, updateData);
                alert('수정되었습니다.');
                await loadDetail(); // 데이터 새로고침
                toggleEditMode(false); // 뷰 모드로 전환
            } catch (error) {
                alert('수정 실패: ' + error.message);
            }
        }

        // --- Initial Setup ---
        backBtn.onclick = () => history.back();
        
        editBtn.addEventListener('click', () => {
            if (isEditMode) {
                handleSave();
            } else {
                toggleEditMode(true);
            }
        });
        
        deleteBtn.addEventListener('click', () => {
            if (isEditMode) {
                toggleEditMode(false); // 수정 취소
            } else {
                deleteModal.style.display = 'flex'; // 삭제 모달 열기
            }
        });

        // 삭제 모달 관련 이벤트
        document.getElementById('modalCancel').onclick = () => deleteModal.style.display = 'none';
        document.getElementById('modalConfirm').addEventListener('click', async () => {
            try {
                await deleteJournal(recordId);
                alert('삭제되었습니다.');
                window.location.href = `../myplant_diary/myplant_diary.html?id=${plantId}`; // 다이어리 목록으로 이동
            } catch (e) {
                alert('삭제 실패: ' + e.message);
                deleteModal.style.display = 'none';
            }
        });
        
        // 태그 수정 버튼 이벤트 위임
        tagContainerEl.addEventListener('click', (e) => {
            if (e.target.classList.contains('tag-edit-btn')) {
                const btn = e.target;
                const isActive = btn.dataset.active === 'true';
                btn.dataset.active = !isActive; // 상태 토글
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadDetail();
        });
    </script>
</body>
</html>
