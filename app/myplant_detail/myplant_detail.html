<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>내 식물 상세정보</title>
    <link rel="stylesheet" href="myplant_detail.css">
    <link rel="stylesheet" href="../../register/registerglobal.css"> <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="app-container">
        <header id="detail-header">
            <a href="/app/main/main.html" class="back-button">
                <i data-lucide="chevron-left"></i>
            </a>
            <h1 id="plant-nickname-header">로딩 중...</h1>
            <button class="menu-button">
                <i data-lucide="more-vertical"></i>
            </button>
        </header>

        <main id="detail-content">
            <div id="loading-spinner" class="loading-active">
                <div class="spinner"></div>
            </div>

            <div id="plant-data-container" style="display: none;">
                
                <section class="plant-profile">
                    <img id="plant-image" src="https://placehold.co/400x400" alt="식물 이미지">
                    <!-- 닉네임 편집 -->
                    <div style="display: flex; align-items: center; gap: 10px; justify-content: center; margin-top: 15px;">
                        <input type="text" id="plant-nickname-input" style="font-size: 1.5em; font-weight: bold; padding: 5px; border: 1px solid #ddd; border-radius: 4px; text-align: center;">
                        <button id="save-nickname-btn" style="padding: 8px 15px; font-size: 0.9em;">저장</button>
                    </div>
                    <p id="plant-species-name"></p>
                    <!-- 입양일 편집 -->
                    <div style="display: flex; align-items: center; gap: 10px; justify-content: center; margin-top: 10px;">
                        <label><strong>입양일:</strong></label>
                        <input type="date" id="plant-adoption-date-input" style="padding: 5px; border-radius: 4px; border: 1px solid #ddd;">
                        <button id="save-date-btn" style="padding: 8px 15px; font-size: 0.9em;">저장</button>
                    </div>
                </section>

                <section class="info-card">
                    <h3>🌳 식별 후보 목록</h3>
                    <p>등록 시점의 식별 API 결과입니다.</p>
                    <select id="suggestions-dropdown"></select>
                    <div id="suggestion-detail" class="suggestion-info">
                        </div>
                </section>

                <section class="info-card">
                    <h3>🩺 건강 상태 분석</h3>
                    <div id="disease-info">
                        </div>
                </section>

                <section class="info-card">
                    <h3>📊 기타 분석 정보</h3>
                    <div id="other-info">
                        </div>
                </section>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();
    </script>

    <script type="module">
        // API 함수 임포트
        import { getMyPlantDetail } from '../plant/plant_api.js';

        // --- DOM 요소 가져오기 ---
        const loadingSpinner = document.getElementById('loading-spinner');
        const dataContainer = document.getElementById('plant-data-container');
    
        // 기본 정보
        const headerTitle = document.getElementById('plant-nickname-header');
        const plantImage = document.getElementById('plant-image');
        const plantNicknameInput = document.getElementById('plant-nickname-input'); // ✅ 추가
        const plantSpeciesName = document.getElementById('plant-species-name');
        const plantAdoptionDateInput = document.getElementById('plant-adoption-date-input'); // ✅ 추가
        
        // 식별 후보
        const suggestionsDropdown = document.getElementById('suggestions-dropdown');
        const suggestionDetail = document.getElementById('suggestion-detail');

        // 건강 상태
        const diseaseInfoContainer = document.getElementById('disease-info');
        // 기타 정보
        const otherInfoContainer = document.getElementById('other-info');

        // ✅ 현재 식물 ID 저장용 전역 변수
        let currentPlantId = null;

        /**
         * 백엔드에서 받은 내 식물 기본 정보를 화면에 렌더링
         */
        function renderBaseInfo(plant, firstSuggestionName) {
            const imageUrl = plant.image_url || 'https://placehold.co/400x400';
            const nickname = plant.nickname || '이름 없음';
            const speciesName = firstSuggestionName || plant.common_name || '종 정보 없음';

            headerTitle.textContent = nickname;
            plantImage.src = imageUrl;
            plantNicknameInput.value = nickname; // ✅ input에 값 설정
            plantSpeciesName.textContent = speciesName;

            // 입양일 input에 값 설정
            if (plant.adoption_date) {
                plantAdoptionDateInput.value = plant.adoption_date;
            }
        }

        /**
         * 닉네임 업데이트 함수
         */
        async function updatePlantNickname(plantId, newNickname) {
            if (!newNickname || newNickname.trim() === '') {
                alert('닉네임을 입력해주세요.');
                return;
            }

            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch(`http://localhost:8080/api/v1/my-plants/${plantId}`, {
                    method: 'PATCH',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ nickname: newNickname })
                });

                if (!response.ok) {
                    throw new Error('서버 응답 오류');
                }

                headerTitle.textContent = newNickname;
                alert('닉네임이 저장되었습니다!');
            } catch (error) {
                console.error('닉네임 저장 실패:', error);
                alert('닉네임 저장에 실패했습니다.');
            }
        }

        /**
         * 입양일 업데이트 함수
         */
        async function updatePlantAdoptionDate(plantId, newDate) {
            if (!newDate) {
                alert('입양일을 선택해주세요.');
                return;
            }

            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch(`http://localhost:8080/api/v1/my-plants/${plantId}`, {
                    method: 'PATCH',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ adoptionDate: newDate })
                });

                if (!response.ok) {
                    throw new Error('서버 응답 오류');
                }

                alert('입양일이 저장되었습니다!');
                
                // 식별 후보 상세 정보 다시 렌더링 (입양일 업데이트)
                const selectedIndex = suggestionsDropdown.value;
                if (suggestionsDropdown.dataset.suggestions) {
                    const suggestions = JSON.parse(suggestionsDropdown.dataset.suggestions);
                    if (suggestions[selectedIndex]) {
                        renderSuggestionDetail(suggestions[selectedIndex]);
                    }
                }
            } catch (error) {
                console.error('입양일 저장 실패:', error);
                alert('입양일 저장에 실패했습니다.');
            }
        }

        /**
         * plant.id의 식별 후보(suggestions)를 드롭다운으로 렌더링
         */
        function renderSuggestions(suggestions) {
            if (!suggestions || suggestions.length === 0) {
                suggestionsDropdown.innerHTML = '<option value="">식별 후보 없음</option>';
                return;
            }

            suggestionsDropdown.innerHTML = '';
            suggestionsDropdown.dataset.suggestions = JSON.stringify(suggestions);

            suggestions.forEach((suggestion, index) => {
                const percentage = (suggestion.probability * 100).toFixed(1);
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `#${index + 1}: ${suggestion.name} (${percentage}%)`;
                suggestionsDropdown.appendChild(option);
            });

            // 드롭다운 변경 시 상세 정보 표시
            suggestionsDropdown.addEventListener('change', (e) => {
                const selectedIndex = e.target.value;
                const selectedSuggestion = suggestions[selectedIndex];
                renderSuggestionDetail(selectedSuggestion);
            });

            // 첫 번째 항목을 기본으로 선택 및 정보 표시
            renderSuggestionDetail(suggestions[0]);
        }

        /**
         * 선택된 식별 후보 1개의 상세 정보를 렌더링
         */
        function renderSuggestionDetail(suggestion) {
            const commonName = suggestion.common_name || suggestion.name || '이름 없음';
            const scientificName = suggestion.scientific_name || suggestion.name || '';
            const imageUrl = suggestion.image_url || suggestion.imageUrl;
            const description = suggestion.description || '제공된 설명이 없습니다.';
            
            // 입양일 가져오기
            const adoptionDate = plantAdoptionDateInput.value;

            let imageHtml = '';
            if (imageUrl) {
                imageHtml = `<img src="${imageUrl}" alt="${commonName}" style="max-width: 100%; border-radius: 8px; margin-top: 10px; margin-bottom: 10px;">`;
            }

            // ✅ 입양일을 학명 밑에 표시
            let adoptionDateHtml = '';
            if (adoptionDate) {
                adoptionDateHtml = `<p><strong>입양일:</strong> ${adoptionDate}</p>`;
            }

            suggestionDetail.innerHTML = `
                <h4>${commonName}</h4>
                <p><strong>학명:</strong> <i>${scientificName}</i></p>
                ${adoptionDateHtml}
                ${imageHtml}
                <p style="margin-top: 10px;"><strong>설명:</strong> ${description}</p>
                <p style="margin-top:10px; font-size: 0.9em; color: #666;">
                    (위키피디아 등 외부 링크 기능은 준비 중입니다)
                </p>
            `;
        }

        /**
         * 페이지 로드 시 실행되는 메인 함수
         */
        async function loadPlantDetail() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const plantId = urlParams.get('id');

                if (!plantId) throw new Error('식물 ID가 URL에 없습니다.');

                // ✅ 전역 변수에 저장
                currentPlantId = plantId;

                const plantDetail = await getMyPlantDetail(plantId);
                console.log("백엔드 응답:", plantDetail);

                // suggestions를 먼저 선언
                let suggestions = plantDetail.identification_candidates 
                            || plantDetail.identificationCandidates 
                            || [];
                
                if (typeof suggestions === 'string') {
                    try {
                        suggestions = JSON.parse(suggestions);
                    } catch (e) {
                        console.warn("JSON 파싱 실패", e);
                        suggestions = [];
                    }
                }

                const firstSuggestionName = suggestions.length > 0 ? suggestions[0].name : null;
                renderBaseInfo(plantDetail, firstSuggestionName);

                // 식별 후보 렌더링
                renderSuggestions(suggestions);

                // ✅ 버튼 이벤트 리스너 등록 (한 번만!)
                document.getElementById('save-nickname-btn').addEventListener('click', () => {
                    const newNickname = plantNicknameInput.value.trim();
                    updatePlantNickname(currentPlantId, newNickname);
                });

                document.getElementById('save-date-btn').addEventListener('click', () => {
                    const newDate = plantAdoptionDateInput.value;
                    updatePlantAdoptionDate(currentPlantId, newDate);
                });
                
                // 기타 정보 처리
                if (diseaseInfoContainer) diseaseInfoContainer.innerHTML = '<p>건강 분석 데이터가 없습니다.</p>';
                if (otherInfoContainer) otherInfoContainer.innerHTML = '<p>추가 분석 데이터가 없습니다.</p>';

                loadingSpinner.classList.remove('loading-active');
                dataContainer.style.display = 'block';

            } catch (error) {
                console.error('로드 실패:', error);
                loadingSpinner.classList.remove('loading-active');
                dataContainer.innerHTML = `<p class="error-message">오류: ${error.message}</p>`;
                dataContainer.style.display = 'block';
            }
        }

        // 스크립트 실행
        document.addEventListener('DOMContentLoaded', loadPlantDetail);
    </script>
</body>
</html>
