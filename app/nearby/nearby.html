<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>주변 화원 찾기</title>
    <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="nearby.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="app-container">
        <div class="header-container">
            <div class="header">
                <button id="back-btn" class="icon-btn">
                    <i data-lucide="arrow-left"></i>
                </button>
                <div class="header-title-container">
                    <h1 class="header-title">📍 주변 화원 찾기</h1>
                </div>
                <div class="header-utils"></div>
            </div>
        </div>

        <div id="map" class="map-container">
            <div id="loading-overlay" class="loading-overlay">
                <div class="loader"></div>
                <p>현재 위치를 기반으로<br>주변 화원을 찾고 있어요...</p>
            </div>
        </div>

        <div id="results-panel" class="results-panel">
            <div class="panel-header">
                <h2 id="panel-title">검색 결과</h2>
                <div id="place-count" class="place-count"></div>
            </div>
            <ul id="places-list" class="places-list">
                <!-- 검색 결과가 여기에 동적으로 추가됩니다 -->
            </ul>
        </div>
        
    </div>
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=6e9e8b4614297f4eeafdf8a536e83775&libraries=services"></script>
    <script type="module" src="nearby.js"></script>
</body>
</html>
