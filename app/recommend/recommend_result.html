<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>맞춤 식물 추천 결과</title>
    <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="recommend_result.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="app-container">
        <div class="header-container">
            <div class="header">
                <!-- Left side: Retake Survey Button -->
                <button id="retake-survey-btn" class="icon-btn">
                    <i data-lucide="refresh-cw"></i>
                </button>
                
                <!-- Center: Title -->
                <div style="flex-grow: 1; text-align: center;">
                    <h1 class="header-title">🪴 맞춤 식물 추천 결과</h1>
                </div>

                <!-- Right side: Notifications and Profile Buttons -->
                <div style="display: flex; gap: 8px; align-items: center;">
                    <button id="notifications-btn" class="icon-btn">
                        <i data-lucide="bell"></i>
                    </button>
                    <button id="profileBtn" class="icon-btn">
                        <i data-lucide="user"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="content">
            <h2 id="recommendation-header" class="recommendation-header-title">
                </h2>
            
            <div id="analysis-summary-card" class="analysis-summary-card">
                </div>
            
            <div id="result-container" class="recommend-list">
                </div>
        </div>

        <nav id="bottom-nav">
            <a href="/app/main/main.html" class="nav-item">
                <i data-lucide="home"></i>
                <span>홈</span>
            </a>
            <a href="/app/dictionary/dictionary.html" class="nav-item">
                <i data-lucide="book-open"></i>
                <span>백과사전</span>
            </a>
            
            <a href="/app/diagnosis/diagnosis.html" class="nav-item center-item">
                <div class="center-circle-btn">
                    <i data-lucide="camera" style="width: 28px; height: 28px;"></i>
                </div>
                <div class="tooltip-bubble">아픈 식물을 진단하세요</div>
            </a>

            <a href="/app/recommend/recommend.html" class="nav-item">
                <i data-lucide="sparkles"></i> <span>추천</span>
            </a>
            <a href="/app/calendar/calendar.html" class="nav-item">
                <i data-lucide="calendar"></i>
                <span>캘린더</span>
            </a>
        </nav>
    </div>

    <script>
        lucide.createIcons();
    </script>
    <script type="module" src="recommend_result.js"></script>
</body>
</html>
