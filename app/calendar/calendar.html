<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>관리 캘린더</title>
    <link rel="stylesheet" href="calendar.css">
    <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* 일정이 없을 때 안내 문구 스타일 */
        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: #9CA3AF;
            font-size: 14px;
            background: white;
            border-radius: 12px;
            border: 1px dashed #E5E5E0;
        }
    </style>
</head>
<body>
  <div id="app-container">
   
    <div class="header">
      <div>
        <h1 class="header-title">관리 캘린더</h1>
        <p class="subtitle">식물 관리 일정을 확인하세요</p>
      </div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <button id="notifications-btn" class="icon-btn">
            <i data-lucide="bell"></i>
        </button>
        <button id="profileBtn" class="icon-btn">
            <i data-lucide="user"></i>
        </button>
      </div>
    </div>
    <div class="month-box">
        <div class="month-header">
            <button id="prevMonthBtn" class="icon-btn">
                <i data-lucide="chevron-left"></i>
            </button>
            <h2 id="currentMonthYear"></h2>
            <button id="nextMonthBtn" class="icon-btn">
                <i data-lucide="chevron-right"></i>
            </button>
        </div>
        <div class="week-header">
            <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
        </div>
        <div id="calendarGrid" class="calendar-grid"></div>
    </div>
    <div class="upcoming-header">
        <h3>다가오는 일정</h3>
        <button id="addScheduleBtn" class="add-btn">
            <i data-lucide="plus" width="16"></i>
            일정 추가
        </button>
    </div>
    <div id="scheduleList" class="upcoming-list"></div>
    
    <div id="addModal" class="modal">
        <div class="modal-content">
            <h2>일정 추가</h2>
            <p class="modal-desc">새로운 관리 일정을 추가하세요</p>
           
            <div class="form-group">
                <label>날짜</label>
                <input type="date" id="inputDate" class="input">
            </div>
           
            <div class="form-group">
                <label>식물</label>
                <select id="inputPlant" class="input">
                    <option value="" disabled selected>식물을 선택하세요</option>
                </select>
            </div>
            <div class="form-group">
                <label>활동 종류</label>
                <select id="inputType" class="input">
                    <option value="WATER" selected>물주기</option>
                    <option value="REPOT">분갈이</option>
                    <option value="FERTILIZE">비료주기</option>
                </select>
            </div>
            <div class="form-group">
                <label>반복 주기</label>
                <select id="inputRecurrence" class="input">
                    <option value="NONE" selected>반복 안함</option>
                    <option value="DAILY">매일</option>
                    <option value="WEEKLY">매주</option>
                    <option value="MONTHLY">매달</option>
                </select>
            </div>
            <div class="modal-buttons">
                <button id="closeModalBtn" class="modal-btn cancel">취소</button>
                <button id="saveScheduleBtn" class="modal-btn confirm">추가하기</button>
            </div>
        </div>
    </div>
    
    <div id="viewScheduleModal" class="modal">
        <div class="modal-content">
            <h2 id="viewModalDate">날짜</h2>
            <p class="modal-desc">등록된 일정 목록입니다.</p>
            <div id="viewScheduleList" class="schedule-list-container"></div>
            <div class="modal-buttons">
                <button id="closeViewModalBtn" class="modal-btn cancel" style="width: 100%;">닫기</button>
            </div>
        </div>
    </div>
    
    <nav id="bottom-nav">
        <a href="/app/main/main.html" class="nav-item">
            <i data-lucide="home"></i>
            <span>홈</span>
        </a>
        <a href="/app/dictionary/dictionary.html" class="nav-item">
            <i data-lucide="book-open"></i>
            <span>백과사전</span>
        </a>
        <a href="/app/diagnosis/diagnosis.html" class="nav-item center-item">
            <div class="center-circle-btn">
                <i data-lucide="camera" style="width: 28px; height: 28px;"></i>
            </div>
            <div class="tooltip-bubble">아픈 식물을 진단하세요</div>
        </a>
        <a href="/app/recommend/recommend.html" class="nav-item">
            <i data-lucide="sparkles"></i>
            <span>추천</span>
        </a>
        <a href="/app/calendar/calendar.html" class="nav-item active">
            <i data-lucide="calendar"></i>
            <span>캘린더</span>
        </a>
    </nav>
  </div>

  <script type="module">
    import { getMySchedules, addSchedule, deleteSchedule } from './schedule_api.js';
    import { getMyPlants } from '../plant/plant_api.js';
   
    lucide.createIcons();
    let currentDate = new Date();
    const today = new Date();
   
    let scheduleDataMap = {};
    let rawSchedules = [];
   
    const gridEl = document.getElementById('calendarGrid');
    const monthYearEl = document.getElementById('currentMonthYear');
    const scheduleListEl = document.getElementById('scheduleList');
   
    const modal = document.getElementById('addModal');
    const addBtn = document.getElementById('addScheduleBtn');
    const closeBtn = document.getElementById('closeModalBtn');
    const saveBtn = document.getElementById('saveScheduleBtn');
    const inputDate = document.getElementById('inputDate');
    const inputPlant = document.getElementById('inputPlant');
    const inputType = document.getElementById('inputType');
    const inputRecurrence = document.getElementById('inputRecurrence');

    // ★★★★★ 여기만 추가됨! 정확히 한 번만 정의 ★★★★★
    function getTypeName(type) {
        if(type === 'water') return '물주기';
        if(type === 'repot') return '분갈이';
        if(type === 'fertilize') return '비료주기';
        return type;
    }
    // ★★★★★ 여기까지 ★★★★★

    async function init() {
        await loadPlantsIntoSelect();
        await fetchAndRenderCalendar();
        setActiveNavItem();
        setupHeaderButtonListeners();
    }

    async function loadPlantsIntoSelect() {
        try {
            const plants = await getMyPlants();
            inputPlant.innerHTML = '<option value="" disabled selected>식물을 선택하세요</option>';
            if (plants.length === 0) {
                inputPlant.innerHTML += '<option value="" disabled>등록된 식물이 없습니다</option>';
                return;
            }
            plants.forEach(plant => {
                const option = document.createElement('option');
                option.value = plant.my_plant_id;
                option.textContent = plant.nickname;
                inputPlant.appendChild(option);
            });
        } catch (error) {
            console.error("식물 목록 로드 실패:", error);
            alert('식물 목록에 식물이 없습니다. 먼저 식물을 등록해주세요.');
        }
    }

    function expandRecurrence(schedule, monthStartDate, monthEndDate) {
        const expandedEvents = [];
        let currentEventDate = new Date(schedule.nextDueDate);
        if (currentEventDate > monthEndDate) return [];

        while (currentEventDate <= monthEndDate) {
            if (currentEventDate >= monthStartDate && currentEventDate <= monthEndDate) {
                expandedEvents.push({
                    ...schedule,
                    displayDate: new Date(currentEventDate)
                });
            }
            if (schedule.frequencyDays === null) break;
            else if (schedule.frequencyDays === 1) currentEventDate.setDate(currentEventDate.getDate() + 1);
            else if (schedule.frequencyDays === 7) currentEventDate.setDate(currentEventDate.getDate() + 7);
            else if (schedule.frequencyDays === 30) currentEventDate.setDate(currentEventDate.getDate() + 30);
            else break;
        }
        return expandedEvents;
    }

    async function fetchAndRenderCalendar() {
        try {
            rawSchedules = await getMySchedules();
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const monthStartDate = new Date(year, month, 1);
            const monthEndDate = new Date(year, month + 1, 0);

            scheduleDataMap = {};
            rawSchedules.forEach(sch => {
                const baseSchedule = {
                    ...sch,
                    nextDueDate: new Date(sch.nextDueDate)
                };
                const expanded = expandRecurrence(baseSchedule, monthStartDate, monthEndDate);
                expanded.forEach(expSch => {
                    const dateKey = `${expSch.displayDate.getFullYear()}-${String(expSch.displayDate.getMonth()+1).padStart(2,'0')}-${String(expSch.displayDate.getDate()).padStart(2,'0')}`;
                    if (!scheduleDataMap[dateKey]) scheduleDataMap[dateKey] = [];
                    scheduleDataMap[dateKey].push({
                        type: expSch.scheduleType.toLowerCase(),
                        plant: expSch.plantNickname || '알 수 없음',
                        id: expSch.scheduleId,
                        isRecurring: expSch.frequencyDays !== null && expSch.frequencyDays !== 0
                    });
                });
            });
            renderCalendar();
            renderScheduleList();
        } catch (error) {
            console.error("스케줄 로드 실패", error);
        }
    }

    function renderCalendar() {
        gridEl.innerHTML = '';
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        monthYearEl.textContent = `${year}년 ${month + 1}월`;
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const daysInMonth = lastDay.getDate();
        const startDayOfWeek = firstDay.getDay();

        for (let i = 0; i < startDayOfWeek; i++) {
            gridEl.appendChild(document.createElement('div'));
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            const btn = document.createElement('button');
            btn.className = 'calendar-day';

            if (year === today.getFullYear() && month === today.getMonth() && day === today.getDate()) {
                btn.classList.add('today');
            }

            const dailySchedules = scheduleDataMap[dateStr] || [];
            if (dailySchedules.length > 0) btn.classList.add('has-schedule');

            const numSpan = document.createElement('span');
            numSpan.className = 'calendar-day-number';
            numSpan.textContent = day;
            btn.appendChild(numSpan);

            const iconContainer = document.createElement('div');
            iconContainer.className = 'calendar-icons';
            dailySchedules.slice(0, 3).forEach(sch => {
                const dot = document.createElement('div');
                dot.style.width = dot.style.height = '5px';
                dot.style.borderRadius = '50%';
                if(sch.type === 'water') dot.style.backgroundColor = '#3B82F6';
                else if(sch.type === 'repot') dot.style.backgroundColor = '#F59E0B';
                else if(sch.type === 'fertilize') dot.style.backgroundColor = '#4A7C59';
                else dot.style.backgroundColor = '#6B7280';
                iconContainer.appendChild(dot);
            });
            btn.appendChild(iconContainer);

            btn.addEventListener('click', () => {
                if (dailySchedules.length > 0) {
                    openViewModal(dateStr, dailySchedules);
                } else {
                    inputDate.value = dateStr;
                    inputRecurrence.value = 'NONE';
                    modal.classList.add('show');
                }
            });
            gridEl.appendChild(btn);

        }
    }

    function renderScheduleList() {
        scheduleListEl.innerHTML = '';
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const allSchedulesInMonth = [];

        Object.keys(scheduleDataMap).forEach(dateKey => {
            const scheduleDate = new Date(dateKey);
            if (scheduleDate >= today && scheduleDate.getMonth() === month && scheduleDate.getFullYear() === year) {
                scheduleDataMap[dateKey].forEach(sch => {
                    allSchedulesInMonth.push({ ...sch, displayDate: scheduleDate });
                });
            }
        });

        allSchedulesInMonth.sort((a, b) => a.displayDate - b.displayDate);

        let count = 0;
        allSchedulesInMonth.forEach(item => {
            const card = document.createElement('div');
            card.className = 'schedule-card';
            let iconHtml = '', bgClass = '';
            if(item.type === 'water') { iconHtml = '<i data-lucide="droplets"></i>'; bgClass = 'bg-blue'; }
            else if(item.type === 'repot') { iconHtml = '<i data-lucide="scissors"></i>'; bgClass = 'bg-yellow'; }
            else if(item.type === 'fertilize') { iconHtml = '<i data-lucide="sprout"></i>'; bgClass = 'bg-green'; }
            else { iconHtml = '<i data-lucide="bookmark"></i>'; bgClass = 'bg-gray'; }

            const dateStr = `${item.displayDate.getFullYear()}-${String(item.displayDate.getMonth()+1).padStart(2,'0')}-${String(item.displayDate.getDate()).padStart(2,'0')}`;
            let recurrenceText = item.isRecurring ? ' (반복)' : '';

            card.innerHTML = `
                <div class="schedule-icon ${bgClass}">${iconHtml}</div>
                <div class="schedule-main">
                    <p>${item.plant} ${getTypeName(item.type)}${recurrenceText}</p>
                    <span>${dateStr}</span>
                </div>
            `;
            scheduleListEl.appendChild(card);
            count++;
        });

        if (count === 0) {
            scheduleListEl.innerHTML = `<div class="empty-state"><p>추가한 일정이 없습니다.</p></div>`;
        } else {
            lucide.createIcons();
        }
    }

    document.getElementById('prevMonthBtn').addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() - 1);
        fetchAndRenderCalendar();
    });
    document.getElementById('nextMonthBtn').addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() + 1);
        fetchAndRenderCalendar();
    });

    addBtn.addEventListener('click', () => {
        inputDate.value = new Date().toISOString().split('T')[0];
        inputRecurrence.value = 'NONE';
        modal.classList.add('show');
    });

    closeBtn.addEventListener('click', () => modal.classList.remove('show'));

    saveBtn.addEventListener('click', async () => {
        const date = inputDate.value;
        const plantId = inputPlant.value;
        const type = inputType.value;
        const recurrence = inputRecurrence.value;

        if(!date || !plantId || !type) {
            alert('날짜, 식물, 활동 종류를 모두 선택해주세요.');
            return;
        }

        let frequencyDays = null;
        if (recurrence === 'DAILY') frequencyDays = 1;
        else if (recurrence === 'WEEKLY') frequencyDays = 7;
        else if (recurrence === 'MONTHLY') frequencyDays = 30;

        const requestData = {
            "next_due_date": date,
            "plant_id": Number(plantId),
            "schedule_type": type,
            "frequency_days": frequencyDays
        };

        try {
            await addSchedule(requestData);
            alert('일정이 추가되었습니다!');
            modal.classList.remove('show');
            await fetchAndRenderCalendar();
        } catch (error) {
            console.error('일정 추가 실패:', error);
            alert('일정 추가에 실패했습니다: ' + error.message);
        }
    });

    function setActiveNavItem() {
        const navItems = document.querySelectorAll('#bottom-nav .nav-item');
        const currentPath = window.location.pathname;
        navItems.forEach(item => {
            item.classList.remove('active');
            if (item.getAttribute('href') === currentPath) item.classList.add('active');
        });
    }

    function setupHeaderButtonListeners() {
        document.getElementById('notifications-btn').addEventListener('click', () => {
            window.location.href = '/app/alarm/alarm.html';
        });
        document.getElementById('profileBtn').addEventListener('click', () => {
            window.location.href = '/app/profile/profile.html';
        });
    }

    const viewModal = document.getElementById('viewScheduleModal');
    const viewListEl = document.getElementById('viewScheduleList');
    const viewDateEl = document.getElementById('viewModalDate');
    const closeViewBtn = document.getElementById('closeViewModalBtn');

    function openViewModal(dateStr, schedules) {
        viewDateEl.textContent = dateStr;
        viewListEl.innerHTML = '';

        schedules.forEach(sch => {
            const item = document.createElement('div');
            item.className = 'schedule-item';
            const typeName = getTypeName(sch.type);
            const recurrenceBadge = sch.isRecurring ? '<span style="font-size:11px; color:#6B7280; margin-left:4px;">(반복)</span>' : '';

            item.innerHTML = `
                <div class="schedule-info">
                    <strong>${sch.plant}</strong>
                    <span>${typeName}</span>
                    ${recurrenceBadge}
                </div>
                <button class="delete-btn" data-id="${sch.id}">
                    <i data-lucide="trash-2" width="16" height="16"></i>
                </button>
            `;

            item.querySelector('.delete-btn').addEventListener('click', async () => {
                if (confirm('정말 이 일정을 삭제하시겠습니까?')) {
                    try {
                        await deleteSchedule(sch.id);
                        alert('삭제되었습니다.');
                        viewModal.classList.remove('show');
                        await fetchAndRenderCalendar();
                    } catch (e) {
                        alert('삭제 실패: ' + e.message);
                    }
                }
            });

            viewListEl.appendChild(item);
        });

        lucide.createIcons();
        viewModal.classList.add('show');
    }

    if (closeViewBtn) {
        closeViewBtn.addEventListener('click', () => viewModal.classList.remove('show'));
    }

    init();
  </script>
</body>
</html>
