<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>관리 캘린더</title>
    <link rel="stylesheet" href="calendar.css"> 
    <link rel="icon" href="../../../assets/images/favicon.svg" type="image/svg+xml">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="app-container">
    
    <div class="header">
      <div>
        <h1 class="header-title">🗓️ 관리 캘린더</h1>
        <p class="subtitle">식물 관리 일정을 확인하세요</p>
      </div>
      <button id="profileBtn" class="icon-btn">
        <i data-lucide="user"></i>
      </button>
    </div>

    <div class="month-box">
        <div class="month-header">
            <button id="prevMonthBtn" class="icon-btn">
                <i data-lucide="chevron-left"></i>
            </button>
            <h2 id="currentMonthYear">2025년 10월</h2>
            <button id="nextMonthBtn" class="icon-btn">
                <i data-lucide="chevron-right"></i>
            </button>
        </div>

        <div class="week-header">
            <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
        </div>

        <div id="calendarGrid" class="calendar-grid">
            </div>
    </div>

    <div class="upcoming-header">
        <h3>다가오는 일정</h3>
        <button id="addScheduleBtn" class="add-btn">
            <i data-lucide="plus" width="16"></i>
            일정 추가
        </button>
    </div>

    <div id="scheduleList" class="upcoming-list">
        </div>

    <div id="addModal" class="modal">
        <div class="modal-content">
            <h2>일정 추가</h2>
            <p class="modal-desc">새로운 관리 일정을 추가하세요</p>
            
            <div class="form-group">
                <label>날짜</label>
                <input type="date" id="inputDate" class="input">
            </div>
            
            <div class="form-group">
                <label>식물</label>
                <select id="inputPlant" class="input">
                    <option value="초록이">초록이 (몬스테라)</option>
                    <option value="뾰족이">뾰족이 (스투키)</option>
                    <option value="공기요정">공기요정 (틸란드시아)</option>
                </select>
            </div>

            <div class="form-group">
                <label>활동 종류</label>
                <select id="inputType" class="input">
                    <option value="water">물주기</option>
                    <option value="repot">분갈이</option>
                    <option value="fertilize">비료주기</option>
                </select>
            </div>

            <div class="modal-buttons">
                <button id="closeModalBtn" class="modal-btn cancel">취소</button>
                <button id="saveScheduleBtn" class="modal-btn confirm">추가하기</button>
            </div>
        </div>
    </div>

    <nav id="bottom-nav">
        <a href="/app/main/main.html" class="nav-item">
            <i data-lucide="home"></i>
            <span>홈</span>
        </a>
        <a href="/app/dictionary/dictionary.html" class="nav-item">
            <i data-lucide="book-open"></i>
            <span>백과사전</span>
        </a>
        
        <a href="/app/diagnosis/diagnosis.html" class="nav-item center-item">
            <div class="center-circle-btn">
                <i data-lucide="camera" style="width: 28px; height: 28px;"></i>
            </div>
            <div class="tooltip-bubble">아픈 식물을 진단하세요</div>
        </a>

        <a href="/app/recommend/recommend.html" class="nav-item">
            <i data-lucide="sparkles"></i>
            <span>추천</span>
        </a>
        <a href="/app/calendar/calendar.html" class="nav-item active">
            <i data-lucide="calendar"></i>
            <span>캘린더</span>
        </a>
    </nav>

  </div>

  <script>
    lucide.createIcons();

    // 상태 변수
    let currentDate = new Date(); // 현재 보고 있는 달
    const today = new Date();     // 오늘 날짜

    // 더미 데이터 (날짜: [일정들])
    // 주의: 실제로는 'YYYY-MM-DD' 문자열 키를 사용하는 것이 좋습니다.
    const scheduleData = {
        '2025-10-25': [
            { type: 'water', plant: '초록이' },
            { type: 'water', plant: '공기요정' }
        ],
        '2025-10-27': [
            { type: 'water', plant: '뾰족이' }
        ],
        '2025-10-30': [
            { type: 'repot', plant: '공기요정' }
        ]
    };

    // DOM 요소
    const gridEl = document.getElementById('calendarGrid');
    const monthYearEl = document.getElementById('currentMonthYear');
    const scheduleListEl = document.getElementById('scheduleList');
    
    // 모달 관련 DOM
    const modal = document.getElementById('addModal');
    const addBtn = document.getElementById('addScheduleBtn');
    const closeBtn = document.getElementById('closeModalBtn');
    const saveBtn = document.getElementById('saveScheduleBtn');
    const inputDate = document.getElementById('inputDate');
    const inputPlant = document.getElementById('inputPlant');
    const inputType = document.getElementById('inputType');

    // ---------------------------------------------
    // 함수: 달력 그리기
    // ---------------------------------------------
    function renderCalendar() {
        gridEl.innerHTML = ''; // 초기화

        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        // 헤더 업데이트
        monthYearEl.textContent = `${year}년 ${month + 1}월`;

        // 이번 달의 첫 날과 마지막 날
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        
        const daysInMonth = lastDay.getDate();
        const startDayOfWeek = firstDay.getDay(); // 0(일) ~ 6(토)

        // 빈 칸 채우기 (첫 주 앞부분)
        for (let i = 0; i < startDayOfWeek; i++) {
            const emptyCell = document.createElement('div');
            gridEl.appendChild(emptyCell);
        }

        // 날짜 채우기
        for (let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${year}-${String(month+1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const btn = document.createElement('button');
            btn.className = 'calendar-day';
            
            // 오늘인지 확인
            if (year === today.getFullYear() && month === today.getMonth() && day === today.getDate()) {
                btn.classList.add('today');
            }

            // 일정이 있는지 확인
            const dailySchedules = scheduleData[dateStr] || [];
            if (dailySchedules.length > 0) {
                btn.classList.add('has-schedule');
            }

            // 날짜 숫자
            const numSpan = document.createElement('span');
            numSpan.className = 'calendar-day-number';
            numSpan.textContent = day;
            btn.appendChild(numSpan);

            // 아이콘 점 표시 (최대 3개)
            const iconContainer = document.createElement('div');
            iconContainer.className = 'calendar-icons';
            dailySchedules.slice(0, 3).forEach(sch => {
                // 아이콘 SVG 문자열 생성 (Lucide 아이콘 대체)
                // 간단하게 작은 점이나 색상 박스로 표현해도 됨. 여기선 SVG 사용
                const dot = document.createElement('div');
                dot.style.width = '4px';
                dot.style.height = '4px';
                dot.style.borderRadius = '50%';
                
                if(sch.type === 'water') dot.style.backgroundColor = '#3B82F6'; // 파랑
                else if(sch.type === 'repot') dot.style.backgroundColor = '#F59E0B'; // 노랑
                else dot.style.backgroundColor = '#4A7C59'; // 초록

                iconContainer.appendChild(dot);
            });
            btn.appendChild(iconContainer);

            // 클릭 이벤트 (상세 보기 - 여기선 alert로 대체)
            btn.addEventListener('click', () => {
                if(dailySchedules.length > 0) {
                    let msg = `${month+1}월 ${day}일 일정:\n`;
                    dailySchedules.forEach(s => msg += `- ${s.plant} (${getTypeName(s.type)})\n`);
                    alert(msg);
                }
            });

            gridEl.appendChild(btn);
        }
    }

    // ---------------------------------------------
    // 함수: 일정 목록 그리기 (전체 목록)
    // ---------------------------------------------
    function renderScheduleList() {
        scheduleListEl.innerHTML = '';
        
        // 날짜순 정렬
        const sortedDates = Object.keys(scheduleData).sort();
        
        // 현재 날짜 이후의 일정만 보여주거나, 전체를 보여줌 (여기선 전체)
        sortedDates.forEach(dateStr => {
            scheduleData[dateStr].forEach(item => {
                const card = document.createElement('div');
                card.className = 'schedule-card';

                // 아이콘 및 배경색 결정
                let iconHtml = '';
                let bgClass = '';
                if(item.type === 'water') {
                    iconHtml = '<i data-lucide="droplets"></i>';
                    bgClass = 'bg-blue';
                } else if(item.type === 'repot') {
                    iconHtml = '<i data-lucide="scissors"></i>';
                    bgClass = 'bg-yellow';
                } else {
                    iconHtml = '<i data-lucide="sprout"></i>';
                    bgClass = 'bg-green';
                }

                card.innerHTML = `
                    <div class="schedule-icon ${bgClass}">
                        ${iconHtml}
                    </div>
                    <div class="schedule-main">
                        <p>${item.plant} ${getTypeName(item.type)}</p>
                        <span>${dateStr}</span>
                    </div>
                `;
                scheduleListEl.appendChild(card);
            });
        });
        
        // 새로 추가된 아이콘 렌더링
        lucide.createIcons();
    }

    function getTypeName(type) {
        if(type === 'water') return '물주기';
        if(type === 'repot') return '분갈이';
        if(type === 'fertilize') return '비료주기';
        return type;
    }

    // ---------------------------------------------
    // 이벤트 리스너
    // ---------------------------------------------
    document.getElementById('prevMonthBtn').addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar();
    });

    document.getElementById('nextMonthBtn').addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar();
    });

    // 모달 열기/닫기
    addBtn.addEventListener('click', () => {
        inputDate.valueAsDate = new Date(); // 오늘 날짜 기본값
        modal.classList.add('show');
    });
    
    closeBtn.addEventListener('click', () => {
        modal.classList.remove('show');
    });

    // 일정 저장
    saveBtn.addEventListener('click', () => {
        const date = inputDate.value;
        const plant = inputPlant.value;
        const type = inputType.value;

        if(!date) {
            alert('날짜를 선택해주세요.');
            return;
        }

        // 데이터 추가
        if(!scheduleData[date]) {
            scheduleData[date] = [];
        }
        scheduleData[date].push({ type, plant });

        // 화면 갱신
        renderCalendar();
        renderScheduleList();
        
        modal.classList.remove('show');
        alert('일정이 추가되었습니다!');
    });

    // 초기 실행
    renderCalendar();
    renderScheduleList();

  </script>
</body>
</html>
