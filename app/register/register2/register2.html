<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>식물 등록 - 2단계</title>
    <!-- Lucide 아이콘 -->
    <script src="https://unpkg.com/lucide@latest/dist/lucide.min.js"></script>
    <!-- CSS 파일 -->
    <link rel="stylesheet" href="../registerglobal.css">
    <link rel="stylesheet" href="register2.css">
</head>
<body>

    <!-- 2단계: 사진 분석 -->
    <div id="step-2" class="step-screen active">
        <div class="header">
            <a href="../register1/register1.html" id="back-btn-step2" class="icon-button">
                <i data-lucide="arrow-left"></i>
            </a>
            <div>
                <h1 class="header-title">식물 등록</h1>
                <p class="header-subtitle">2/3 단계</p>
            </div>
        </div>

        <div class="content-scroll">
            <div class="image-wrapper-square">
                <img id="plant-image-step2" src="https://via.placeholder.com/300" alt="등록할 식물" />
            </div>

            <div class="card">
                <div class="card-header">
                    <div class="icon-circle-small">
                        <i data-lucide="check" class="check-icon"></i>
                    </div>
                    <div class="card-title-group">
                        <h3 class="card-title">분석 완료!</h3>
                        <p class="card-subtitle">Plant.id API 분석 결과</p>
                    </div>
                </div>

                <div class="analysis-result-box">
                    <p id="analysis-name" class="analysis-name-text">몬스테라 델리시오사</p>
                    <p id="analysis-scientific" class="analysis-scientific-text">Monstera Deliciosa</p>
                    <div class="progress-bar-container">
                        <div class="progress-bar-bg">
                            <div id="progress-bar" class="progress-bar-fg" style="width: 98%;"></div>
                        </div>
                        <span id="analysis-confidence" class="progress-text">98%</span>
                    </div>
                </div>
            </div>

            <div class="button-group">
                <a href="../register3/register3.html" id="confirm-species-btn" class="button button-primary">
                    맞아요, 다음으로
                </a>
                <a href="../register1/register1.html" id="retake-photo-btn" class="button button-outline">
                    다시 촬영하기
                </a>
            </div>
        </div>
    </div>

    <!-- JS 파일 -->
    <script>
        lucide.createIcons();
    </script>
    <script src="../register.js"></script>
</body>
</html>
