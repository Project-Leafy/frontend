<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>식물 등록 - 3단계</title>
    <script src="https://unpkg.com/lucide@latest/dist/lucide.min.js"></script>
    <link rel="stylesheet" href="../registerglobal.css">
    <link rel="stylesheet" href="register3.css">
    <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
</head>
<body>

    <div id="step-3" class="step-screen active">
        <div class="header">
            <a href="/app/main/main.html" class="icon-button">
                <i data-lucide="arrow-left" style="color: black;"></i>
            </a>
            <div>
                <h1 class="header-title">식물 등록</h1>
                <p class="header-subtitle">3/3 단계</p>
            </div>
        </div>

        <div class="content-scroll">
            <div class="image-wrapper-wide">
                <img id="plant-image-step3" src="https://via.placeholder.com/300x200" alt="등록할 식물" />
            </div>

            <div class="care-guide-box">
                <div class="care-guide-header" id="careGuideToggle">
                    <span>💡 이 식물은 이렇게 관리하세요!</span>
                    <i data-lucide="chevron-down" id="careGuideIcon"></i>
                </div>
                <div class="care-guide-content" id="careGuideContent">
                    <p id="aiDescription">정보를 불러오는 중...</p>
                </div>
            </div>

            <div class="form-group">
                <div class="form-field">
                    <label for="species" class="form-label">식물 종류</label>
                    <input type="text" id="species" class="form-input" readonly />
                </div>
                
                <div class="form-field">
                    <label for="nickname" class="form-label">
                        애칭 <span class="form-label-optional">(선택)</span>
                    </label>
                    <input type="text" id="nickname" class="form-input" placeholder="예: 초록이, 행복이" />
                </div>

                <div class="form-field">
                    <label for="adoptionDate" class="form-label">입양일</label>
                    <input type="date" id="adoptionDate" class="form-input" />
                </div>
            </div>
        </div>

        <div class="footer-fixed">
            <button id="register-btn" class="button button-primary" style="width: 100%;">
                등록 완료
            </button>
        </div>
    </div>

    <div id="scheduleModal" class="modal">
        <div class="modal-content">
            <h2>알림 설정</h2>
            <p class="modal-desc">등록된 식물의 관리 일정을 지금 추가하시겠습니까?</p>
            
            <div class="form-group">
                <label>활동 종류</label>
                <select id="modalType" class="modal-input">
                    <option value="WATER" selected>물주기</option>
                    <option value="REPOT">분갈이</option>
                    <option value="FERTILIZE">비료주기</option>
                </select>
            </div>

            <div class="form-group">
                <label>시작 날짜</label>
                <input type="date" id="modalDate" class="modal-input">
            </div>

            <div class="form-group">
                <label>반복 주기</label>
                <select id="modalFreq" class="modal-input">
                    <option value="NONE">반복 안함</option>
                    <option value="DAILY">매일</option>
                    <option value="WEEKLY" selected>매주</option>
                    <option value="MONTHLY">매달</option>
                </select>
            </div>

            <div class="modal-buttons">
                <button id="skipScheduleBtn" class="modal-btn btn-cancel">나중에 하기</button>
                <button id="saveScheduleBtn" class="modal-btn btn-confirm">일정 추가</button>
            </div>
        </div>
    </div>
    <script>
        lucide.createIcons();
    </script>
    <script type="module" src="../register.js"></script>
    
</body>
</html>
