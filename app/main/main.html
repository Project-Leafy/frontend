<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Leafy - 홈</title>
    <link rel="stylesheet" href="main.css">
    
    <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <script>
        (function () {
            const token = localStorage.getItem('accessToken');
            // 토큰 키 이름 확인 필요 (accessToken vs access_token)
            // 만약 profile.js에서 access_token을 쓴다면 여기도 맞춰야 함.
            // 안전하게 둘 다 체크하거나 하나로 통일 권장.
            if (!token && !localStorage.getItem('access_token')) {
                alert('로그인이 필요한 페이지입니다.');
                window.location.replace('/index.html');
            }
        })();
    </script>

    <div id="app-container">

        <div class="hs-header">
            <div class="hs-header-top">
                <h2>내 식물</h2>
                <div>
                    <button id="notifications-btn" class="hs-icon" aria-label="알림">
                        <i data-lucide="bell"></i>
                        <span id="unread-badge" class="unread-badge" hidden></span>
                    </button>
                    <button id="profile-btn" class="hs-icon">
                        <i data-lucide="user"></i>
                    </button>
                </div>
            </div>
            <p id="plant-count" class="subtitle">로딩 중...</p>
        </div>

        <div class="hs-container">

            <a href="/app/register/register1/register1.html" class="hs-add-btn">
                <i data-lucide="plus-circle" style="margin-right: 6px;"></i>
                식물 등록하기
            </a>

            <div id="plant-list" class="plant-list">
                </div>
        </div>

        <nav id="bottom-nav">
            <a href="/app/main/main.html" class="nav-item active">
                <i data-lucide="home"></i>
                <span>홈</span>
            </a>
            <a href="/app/dictionary/dictionary.html" class="nav-item">
                <i data-lucide="book-open"></i>
                <span>백과사전</span>
            </a>
            
            <a href="/app/diagnosis/diagnosis.html" class="nav-item center-item">
                <div class="center-circle-btn">
                    <i data-lucide="camera" style="width: 28px; height: 28px;"></i>
                </div>
                <div class="tooltip-bubble">아픈 식물을 진단하세요</div>
            </a>

            <a href="/app/recommend/recommend.html" class="nav-item">
                <i data-lucide="sparkles"></i> <span>추천</span>
            </a>
            <a href="/app/calendar/calendar.html" class="nav-item">
                <i data-lucide="calendar"></i>
                <span>캘린더</span>
            </a>
        </nav>

    </div>

    <div id="deleteDialog" class="hs-dialog-backdrop hidden">
        <div class="hs-dialog">
            <h2 style="font-size:18px; font-weight:600; margin:0 0 8px 0;">식물을 삭제할까요?</h2>
            <p style="margin:0; color:#6b7280; font-size:14px;">
                삭제하면 해당 식물과 모든 기록이 사라집니다.
            </p>

            <div class="hs-dialog-buttons">
                <button id="dialogCancel" class="hs-cancel">취소</button>
                <button id="dialogConfirm" class="hs-confirm">삭제</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>

    <script type="module">
        import { getMyPlants, deleteMyPlant } from '../plant/plant_api.js';
        // [추가] 진단 기록 API import
        import { getDiagnosisHistory } from '../diagnosis/diagnosis_api.js';
        import { getMySchedules } from '../calendar/schedule_api.js'; // 경로 확인 필요

        // [추가] 가장 가까운 일정 1개 로드 함수
        async function loadNearestSchedule() {
            const wrapper = document.getElementById('upcoming-schedule-wrapper');
            const cardContainer = document.getElementById('upcoming-schedule-card');
            
            try {
                const schedules = await getMySchedules();
                
                // 1. 날짜 필터링 (오늘 포함, 미래 일정만)
                const today = new Date();
                today.setHours(0, 0, 0, 0);

                const upcoming = schedules.filter(s => {
                    const d = new Date(s.nextDueDate);
                    d.setHours(0, 0, 0, 0);
                    return d >= today;
                });

                // 2. 일정이 없으면 숨김
                if (upcoming.length === 0) {
                    wrapper.style.display = 'none';
                    return;
                }

                // 3. 정렬 (가장 가까운 날짜 순)
                upcoming.sort((a, b) => new Date(a.nextDueDate) - new Date(b.nextDueDate));
                
                // 4. 가장 첫 번째 일정 가져오기
                const nearest = upcoming[0];
                
                // 5. 렌더링
                renderMainScheduleCard(cardContainer, nearest);
                wrapper.style.display = 'block'; // 영역 표시
                
                // 아이콘 렌더링
                if(typeof lucide !== 'undefined') lucide.createIcons();

            } catch (error) {
                console.error('메인 일정 로드 실패:', error);
                wrapper.style.display = 'none';
            }
        }

        // 카드 HTML 생성 함수
        function renderMainScheduleCard(container, s) {
            const type = s.scheduleType.toLowerCase();
            let icon = 'calendar', bgClass = 'bg-gray';
            let typeLabel = '일정';

            if (type === 'water') { icon = 'droplets'; bgClass = 'bg-blue'; typeLabel = '물주기'; }
            else if (type === 'repot') { icon = 'scissors'; bgClass = 'bg-yellow'; typeLabel = '분갈이'; }
            else if (type === 'fertilize') { icon = 'sprout'; bgClass = 'bg-green'; typeLabel = '비료'; }

            // D-Day 계산
            const today = new Date();
            today.setHours(0,0,0,0);
            const due = new Date(s.nextDueDate);
            due.setHours(0,0,0,0);
            
            const diffTime = due - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            let dDayText = '';
            let dDayClass = '';
            
            if (diffDays === 0) {
                dDayText = '오늘';
                dDayClass = ''; // 빨간색
            } else if (diffDays === 1) {
                dDayText = '내일';
                dDayClass = 'future'; // 파란색
            } else {
                dDayText = `D-${diffDays}`;
                dDayClass = 'future';
            }

            const dateStr = `${due.getFullYear()}.${due.getMonth()+1}.${due.getDate()}`;

            container.innerHTML = `
                <div class="main-schedule-card" onclick="location.href='/app/calendar/calendar.html'">
                    <div class="ms-icon ${bgClass}">
                        <i data-lucide="${icon}" width="20" height="20"></i>
                    </div>
                    <div class="ms-content">
                        <p>${s.plantNickname} - ${typeLabel}</p>
                        <span>${dateStr} 예정</span>
                    </div>
                    <div class="d-day-badge ${dDayClass}">
                        ${dDayText}
                    </div>
                </div>
            `;
        }

        // [실행] 기존 loadUserPlants()와 함께 실행
        loadUserPlants();
        loadNearestSchedule(); // ★ 추가됨

        // 선택자 업데이트
        const plantListContainer = document.getElementById('plant-list');
        const plantCountElement = document.getElementById('plant-count'); 
        
        // 다이얼로그 관련 변수
        const deleteDialog = document.getElementById('deleteDialog');
        const dialogCancelBtn = document.getElementById('dialogCancel');
        const dialogConfirmBtn = document.getElementById('dialogConfirm');
        let plantIdToDelete = null; 

        // -----------------------------------------------------------
        // [핵심] 식물 목록 로드 및 상태 표시
        // -----------------------------------------------------------
        async function loadUserPlants() {

            try {
                const myPlants = await getMyPlants();

                plantListContainer.innerHTML = '';
                plantCountElement.textContent = `총 ${myPlants.length}개의 식물`;

                if (myPlants.length === 0) {
                    plantListContainer.innerHTML = '<p style="text-align:center; color:#999; margin-top:40px;">등록된 식물이 없습니다.</p>';
                    return;
                }

                // [병렬 처리] 각 식물의 진단 기록 조회
                const plantsWithStatus = await Promise.all(myPlants.map(async (plant) => {
                    let statusText = "진단 X";
                    let statusColor = "#6B7280"; // 기본 회색

                    try {
                        const history = await getDiagnosisHistory(plant.my_plant_id);
                        
                        if (history && history.length > 0) {
                            const latest = history[0]; 
                            // [판별] 정확도 60% 이상이면 주의 필요
                            if (latest.disease_probability >= 0.6) {
                                statusText = "⚠️ 주의 필요";
                                statusColor = "#EF4444"; // 빨간색
                            } else {
                                statusText = "✅ 진단 O";
                                statusColor = "#10B981"; // 초록색
                            }
                        }
                    } catch (e) {
                        console.warn(`ID ${plant.my_plant_id} 진단 기록 조회 실패`, e);
                        // 에러 시 기본값 유지
                    }

                    return { ...plant, statusText, statusColor };
                }));

                // 카드 렌더링
                plantsWithStatus.forEach(plant => {
                    const plantCard = document.createElement('div');
                    
                    plantCard.className = 'hs-card';
                    plantCard.setAttribute('data-my-plant-id', plant.my_plant_id);

                    const imageUrl = plant.image_url || 'https://placehold.co/400x250';
                    const nickname = plant.nickname || '이름 없음';
                    const speciesName = plant.plant_species_name || '종 정보 없음';

                    plantCard.innerHTML = `
                        <img src="${imageUrl}" alt="${nickname}" class="hs-img" onerror="this.src='https://placehold.co/400x250?text=No+Image'">
                        
                        <button class="hs-delete-btn" data-my-plant-id="${plant.my_plant_id}">
                            <i data-lucide="trash-2"></i>
                        </button>

                        <div class="hs-card-body">
                            <div class="hs-topline">
                                <span class="nickname">${nickname}</span>
                                <span class="type">${speciesName}</span>
                            </div>
                            
                        </div>
                    `;
                    plantListContainer.appendChild(plantCard);
                });

                lucide.createIcons();

            } catch (error) {
                console.error('내 식물 목록을 불러오는 중 에러 발생:', error);
                plantListContainer.innerHTML = '<p style="text-align:center;">목록을 불러오는데 실패했습니다.</p>';
            }
        }

        // -----------------------------------------------------------
        // 이벤트 핸들링
        // -----------------------------------------------------------

        // 1. 다이얼로그 닫기
        function closeDialog() {
            deleteDialog.classList.add('hidden');
            plantIdToDelete = null;
        }

        // 2. 다이얼로그 취소
        dialogCancelBtn.addEventListener('click', closeDialog);

        // 3. 다이얼로그 "삭제" 확정
        dialogConfirmBtn.addEventListener('click', async () => {
            if (!plantIdToDelete) return;

            try {
                await deleteMyPlant(plantIdToDelete);
                
                // UI에서 해당 카드 제거 (UX 향상)
                const cardToRemove = document.querySelector(`.hs-card[data-my-plant-id='${plantIdToDelete}']`);
                if (cardToRemove) cardToRemove.remove();

                alert('식물이 삭제되었습니다.');
                closeDialog();
                
                // 목록 다시 로드 (카운트 갱신 등)
                loadUserPlants();

            } catch (error) {
                console.error('식물 삭제 중 에러 발생:', error);
                alert('식물 삭제에 실패했습니다.');
                closeDialog();
            }
        });


        // 4. 리스트 클릭 이벤트 위임 (카드 클릭 vs 삭제 버튼 클릭)
        plantListContainer.addEventListener('click', (event) => {
            const target = event.target;
            
            const deleteBtn = target.closest('.hs-delete-btn');
            const plantCard = target.closest('.hs-card');

            if (deleteBtn) {
                event.stopPropagation(); // 카드 클릭 막기
                plantIdToDelete = deleteBtn.dataset.myPlantId;
                deleteDialog.classList.remove('hidden');

            } else if (plantCard) {
                // 상세 페이지 이동
                const myPlantId = plantCard.dataset.myPlantId;
                window.location.href = `/app/myplant/myplant_diary/myplant_diary.html?id=${myPlantId}`;
            }
        });

        // 알람 벨 클릭
        document.getElementById('notifications-btn').addEventListener('click', () => {
            window.location.href = '/app/alarm/alarm.html';
        });

        // 프로필 버튼
        document.getElementById('profile-btn').addEventListener('click', () => {
            window.location.href = '/app/profile/profile.html';
        });
        
        // 초기 로드 실행
        loadUserPlants();
    </script>
    <script type="module">
        // 알림 벨에 안 읽은 알림 개수를 표시한다.
        import { getUnreadCount } from '/assets/js/notification_api.js';
        getUnreadCount().then((count) => {
            const badge = document.getElementById('unread-badge');
            if (count > 0) {
                badge.textContent = count > 99 ? '99+' : String(count);
                badge.hidden = false;
            }
        }).catch((e) => console.error('안 읽은 알림 개수 조회 실패:', e));
    </script>
</body>
</html>
