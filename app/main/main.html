<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Leafy - 홈</title>
    <link rel="stylesheet" href="main.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <script>
        (function () {
            const token = localStorage.getItem('accessToken');
            if (!token) {
                alert('로그인이 필요한 페이지입니다.');
                window.location.replace('/index.html');
            }
        })();
    </script>

    <div id="app-container">
        <header id="main-header">
            <h1>내 식물</h1>
        </header>

        <main id="main-content">
            <div class="plant-list">
                <!-- JavaScript로 식물 목록을 여기에 삽입합니다. -->
            </div>
            <a href="/app/register/register1/register1.html" class="register-plant-btn">등록하기</a>
        </main>

        <nav id="bottom-nav">
            <a href="/app/main/main.html" class="nav-item active">
                <i data-lucide="home"></i>
                <span>홈</span>
            </a>
            <a href="#" class="nav-item">
                <i data-lucide="layout-grid"></i>
                <span>모아보기</span>
            </a>
            <a href="/app/diagnose/diagnose.html" class="nav-item">
                <i data-lucide="stethoscope"></i>
                <span>진단하기</span>
            </a>
            <a href="/app/recommend/recommend.html" class="nav-item">
                <i data-lucide="lightbulb"></i>
                <span>추천</span>
            </a>
            <a href="/app/calendar/calendar.html" class="nav-item">
                <i data-lucide="calendar"></i>
                <span>캘린더</span>
            </a>
        </nav>
    </div>

    <script>
        lucide.createIcons();
    </script>

    <script type="module">
        // 1. 'getMyPlants'를 import 하도록 수정
        import { getMyPlants } from '../plant/plant_api.js';

        const plantListContainer = document.querySelector('.plant-list');

        async function loadUserPlants() {
            try {
                // 2. 'getMyPlants()' 함수를 호출하도록 수정
                const myPlants = await getMyPlants();

                plantListContainer.innerHTML = '';

                if (myPlants.length === 0) {
                    plantListContainer.innerHTML = '<p>아직 등록된 식물이 없어요. 첫 식물을 등록해보세요!</p>';
                    return;
                }

                // 3. 백엔드 DTO의 필드명(snake_case)에 맞게 수정
                myPlants.forEach(plant => {
                    const plantCard = document.createElement('a');

                    // 4. 상세 페이지로 이동 시 DTO의 'my_plant_id'를 사용
                    plantCard.href = `/app/myplant_detail/myplant_detail.html?id=${plant.my_plant_id}`;
                    plantCard.className = 'plant-card';

                    // DTO의 필드명(image_url, nickname, plant_species_name)을 사용
                    const imageUrl = plant.image_url || 'https://placehold.co/150';
                    const nickname = plant.nickname || '이름 없음';
                    const speciesName = plant.plant_species_name || '종 정보 없음';

                    plantCard.innerHTML = `
                    <img src="${imageUrl}" alt="${nickname} 이미지">
                    <div class="plant-card-info">
                        <h3>${nickname}</h3> 
                        <p>${speciesName}</p> 
                    </div>
                `;
                    plantListContainer.appendChild(plantCard);
                });

            } catch (error) {
                console.error('내 식물 목록을 불러오는 중 에러 발생:', error);
                plantListContainer.innerHTML = '<p>식물 목록을 불러오는데 실패했습니다. 다시 시도해주세요.</p>';
            }
        }

        // 페이지가 로드되면 식물 목록을 불러옵니다.
        loadUserPlants();
    </script>
</body>

</html>
