<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Leafy - 알림</title>
    <link rel="stylesheet" href="alarm.css">
    <link rel="icon" href="/assets/images/favicon.svg">
    <script src="https://unpkg.com/lucide@latest"></script>
    </head>
<body>
    <div id="app-container"> 

        <div class="hs-header"> 
            <h1>🔔 알림</h1>
            <p>받은 알림과 다가오는 일정을 확인해요</p>
        </div>

        <!-- 앱 안 알림함: 물주기·진단·기념일 알림이 쌓인다 -->
        <div id="inboxSection" class="alarm-list">
            <div class="inbox-header">
                <h3 class="section-title">🔔 알림함 <span id="inboxUnread" class="inbox-count"></span></h3>
                <button id="readAllBtn" class="inbox-read-all" hidden>모두 읽음</button>
            </div>
            <div id="inboxList"></div>
        </div>

        <div id="alarmList" class="alarm-list">
            </div>

        <nav id="bottom-nav">
            <a href="/app/main/main.html" class="nav-item">
                <i data-lucide="home"></i>
                <span>홈</span>
            </a>
            <a href="/app/dictionary/dictionary.html" class="nav-item">
                <i data-lucide="book-open"></i>
                <span>백과사전</span>
            </a>
            
            <a href="/app/diagnosis/diagnosis.html" class="nav-item center-item">
                <div class="center-circle-btn">
                    <i data-lucide="camera" style="width: 28px; height: 28px;"></i>
                </div>
                <div class="tooltip-bubble">아픈 식물을 진단하세요</div>
            </a>

            <a href="/app/recommend/recommend.html" class="nav-item">
                <i data-lucide="sparkles"></i> <span>추천</span>
            </a>
            <a href="/app/calendar/calendar.html" class="nav-item">
                <i data-lucide="calendar"></i>
                <span>캘린더</span>
            </a>
        </nav>
    </div>

    <script>
        lucide.createIcons();
    </script>
    <script type="module" src="alarm.js" defer></script>
    <script type="module" src="inbox.js" defer></script>
</body>
</html>
