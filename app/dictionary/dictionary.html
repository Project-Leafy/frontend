<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>식물 백과사전</title>
    <!-- 파비콘 및 CSS 연결 --> 
    <link rel="icon" href="../../../assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="dictionary.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="app-container">
    
    <!-- 헤더 & 검색창 고정 영역 -->
    <div class="header-container">
        <div class="header">
            <div>
                <h1 class="header-title">📚 식물 백과사전</h1>
                <p class="subtitle">궁금한 식물을 검색해보세요</p>
            </div>
            <div style="display: flex; gap: 8px; align-items: center;">
                <button id="notifications-btn" class="icon-btn">
                    <i data-lucide="bell"></i>
                </button>
                <button id="profileBtn" class="icon-btn">
                    <i data-lucide="user"></i>
                </button>
            </div>
        </div>

        <div class="search-wrapper">
            <div class="search-box">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="식물 이름 검색 (예: 몬스테라)">
            </div>
        </div>
    </div>

    <!-- 메인 컨텐츠 (리스트) -->
    <div class="content">
        <p id="resultCount" class="result-count">전체 0종</p>
        
        <div id="dictionaryList" class="dictionary-list">
            <!-- 자바스크립트로 식물 카드가 여기에 추가됩니다 -->
        </div>
    </div>

    <!-- 하단 내비게이션 (유지) -->
    <nav id="bottom-nav">
        <a href="/app/main/main.html" class="nav-item">
            <i data-lucide="home"></i>
            <span>홈</span>
        </a>
        <a href="/app/dictionary/dictionary.html" class="nav-item active">
            <i data-lucide="book-open"></i>
            <span>백과사전</span>
        </a>
        
        <a href="/app/diagnosis/diagnosis.html" class="nav-item center-item">
            <div class="center-circle-btn">
                <i data-lucide="camera" style="width: 28px; height: 28px;"></i>
            </div>
            <div class="tooltip-bubble">아픈 식물을 진단하세요</div>
        </a>

        <a href="/app/recommend/recommend.html" class="nav-item">
            <i data-lucide="sparkles"></i>
            <span>추천</span>
        </a>
        <a href="/app/calendar/calendar.html" class="nav-item">
            <i data-lucide="calendar"></i>
            <span>캘린더</span>
        </a>
    </nav>

  </div>
  <script src="dictionary.js"></script>
  <script>
      lucide.createIcons();
  </script>
</body>
</html>
