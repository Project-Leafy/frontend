<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>식물 상세 정보</title>
    <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="dictionary_detail.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="app-container">
        <div class="header">
            <button id="back-btn" class="icon-btn"><i data-lucide="arrow-left"></i></button>
            <h1 id="plant-name-header" class="header-title">식물 정보</h1>
            <div style="width: 48px;"></div> <!-- 오른쪽 정렬을 위한 빈 공간 -->
        </div>

        <div class="content">
            <img id="plant-image" src="" alt="식물 이미지" class="plant-main-image">

            <div class="plant-details">
                <div class="detail-item">
                    <div class="detail-icon" style="background-color: #FEF3C7;"><i data-lucide="sun"></i></div>
                    <div class="detail-content">
                        <span class="detail-label">햇빛</span>
                        <span id="sunlight-info" class="detail-value"></span>
                    </div>
                </div>
                <div class="detail-item">
                    <div class="detail-icon" style="background-color: #DBEAFE;"><i data-lucide="droplets"></i></div>
                    <div class="detail-content">
                        <span class="detail-label">물주기</span>
                        <span id="watering-info" class="detail-value"></span>
                    </div>
                </div>
                <div class="detail-item">
                    <div class="detail-icon" style="background-color: #E0E7FF;"><i data-lucide="thermometer"></i></div>
                    <div class="detail-content">
                        <span class="detail-label">적정 온도</span>
                        <span id="temperature-info" class="detail-value"></span>
                    </div>
                </div>
                <div class="detail-item">
                    <div class="detail-icon" style="background-color: #D1FAE5;"><i data-lucide="cloud-fog"></i></div>
                    <div class="detail-content">
                        <span class="detail-label">습도</span>
                        <span id="humidity-info" class="detail-value"></span>
                    </div>
                </div>
                 <div class="detail-item">
                    <div class="detail-icon" style="background-color: #E8F4EC;"><i data-lucide="alert-circle"></i></div>
                    <div class="detail-content">
                        <span class="detail-label">독성 여부</span>
                        <span id="poisoning-info" class="detail-value"></span>
                    </div>
                </div>
            </div>

            <div class="plant-description">
                <h3 class="description-title">식물 설명</h3>
                <p id="plant-description-text"></p>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
    <script type="module" src="dictionary_detail.js"></script>
</body>
</html>
