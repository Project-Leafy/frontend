<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>내 프로필</title>
    <link rel="icon" href="/assets/images/favicon.svg">
    <link rel="stylesheet" href="profile.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="app-container">
        <header class="hs-header">
            <div class="hs-header-top">
                <button class="hs-icon" onclick="history.back()">
                    <i data-lucide="arrow-left"></i>
                </button>
                <h2>내 프로필</h2>
                <button id="logoutBtn" class="hs-icon" aria-label="로그아웃">
                    <i data-lucide="log-out"></i>
                </button>
            </div>
        </header>

        <div class="profile-top">
            <div class="profile-image-wrapper">
                <img id="userAvatar" src="" alt="프로필 사진" onerror="this.src='/assets/images/favicon.svg'">
            </div>
            
            <div class="nickname-wrapper">
                <input type="text" id="userNickname" value="" readonly placeholder="로딩 중...">
            </div>
        </div>

        <div class="info-section">
            <div class="info-item">
                <i data-lucide="calendar-heart" class="info-icon"></i>
                <span class="info-label">서비스 가입일</span>
                
                <span id="togetherSince" class="info-value">...</span>
            </div>
        </div>

        <div class="info-section">
            <div class="info-item">
                <i data-lucide="sprout" class="info-icon"></i>
                <span class="info-label">내 식물</span>
                <span id="plantCount" class="info-value">0개</span>
            </div>
        </div>

        <div class="info-section">
            <div class="section-title">
                <i data-lucide="list" class="section-icon"></i>
                <h3>내 식물 목록</h3>
            </div>
            <div id="myPlantsList" class="plants-grid">
                </div>
        </div>

        
        <div class="info-section">
            <div class="section-title">
                <i data-lucide="heart-pulse" class="section-icon"></i>
                <h3>식물 건강 리포트</h3>
            </div>
            <div class="health-summary">
                <div class="health-item healthy">
                    <i data-lucide="smile"></i>
                    <span>건강한 식물</span>
                    <strong id="healthyCount">0</strong>
                </div>
                <div class="health-item warning">
                    <i data-lucide="frown"></i>
                    <span>주의 필요</span>
                    <strong id="warningCount">0</strong>
                </div>
                <div class="health-item none">
                    <i data-lucide="help-circle"></i>
                    <span>진단 이력 없음</span>
                    <strong id="noneCount">0</strong>
                </div>
            </div>
        </div>

        <nav id="bottom-nav">
            <a href="/app/main/main.html" class="nav-item">
                <i data-lucide="home"></i>
                <span>홈</span>
            </a>
            <a href="/app/dictionary/dictionary.html" class="nav-item">
                <i data-lucide="book-open"></i>
                <span>백과사전</span>
            </a>
            
            <a href="/app/diagnosis/diagnosis.html" class="nav-item center-item">
                <div class="center-circle-btn">
                    <i data-lucide="camera" style="width: 28px; height: 28px;"></i>
                </div>
                <div class="tooltip-bubble">아픈 식물을 진단하세요</div>
            </a>

            <a href="/app/recommend/recommend.html" class="nav-item">
                <i data-lucide="sparkles"></i> <span>추천</span>
            </a>
            <a href="/app/calendar/calendar.html" class="nav-item">
                <i data-lucide="calendar"></i>
                <span>캘린더</span>
            </a>
        </nav>
    </div>

    <script>
        lucide.createIcons();
    </script>
    <script type="module" src="profile.js"></script>
</body>
</html>
